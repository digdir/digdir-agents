# The short-lived agent `agentctl claude login` and `agentctl codex login` run the harness's sign-in in when this
# machine does not have the harness. It is internal, as the README here describes, and agentd runs it for those
# commands as an ephemeral agent, which it deletes when the command ends, however it ends. It runs the sign-in as a
# command, so it declares no harness.
apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: sign-in
spec:
  sandbox:
    # The base every agent image builds on, which has every harness in it.
    image:
      type: reference
      reference: ghcr.io/digdir/agentctl-base:ubuntu-26.04
    platform:
      os: linux
    resources:
      cpu: "2"
      memory: 2Gi
      rootFilesystem:
        capacity: 16Gi
        mode: layered
  network:
    mode: mediated
    # Only the hosts the sign-ins reach, so the credential one mints can go nowhere else. A harness update that reaches
    # another host breaks its sign-in until the host is added here, as the harness upgrade guide says.
    allow:
      # `claude setup-token`
      - api.anthropic.com
      - platform.claude.com
      # `codex login --device-auth`
      - auth.openai.com
