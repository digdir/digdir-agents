<rect x="131" y="1129" width="372" height="16" style="fill:#f6f8fb"/>
<text class="s-sm" x="134" y="1141">over the agent relay, not through agentd: tmux attach-session</text>

<!-- Footnote -->
<text class="s" x="40" y="1201">Startup scans and a scan every 30 s repeat the pass, so a lost wakeup or a daemon restart loses no work. A guest whose heartbeat</text>
<text class="s" x="40" y="1221">stalls for 15 s ends the pass: the Agent reports <tspan class="code-sm">SandboxUnresponsive</tspan> instead of hanging.</text>
<g transform="translate(1180 1207)">
  <path class="edge" d="M0,-4 H32" marker-end="url(#arrow)"/><text class="legend" x="40" y="0">call</text>
  <path class="edge dashed" d="M90,-4 H122" marker-end="url(#arrow)"/><text class="legend" x="130" y="0">reply</text>
  <path class="edge-blue dashed" d="M185,-4 H217" marker-end="url(#arrow-blue)"/><text class="legend" x="225" y="0">direct data</text>
</g>
