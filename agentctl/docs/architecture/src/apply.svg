<rect x="1479" y="211" width="93" height="20" rx="4" style="fill:#f6f8fb"/>
<text class="zone-label" x="1564" y="225" text-anchor="end" style="fill:#5b6b7f">1 · APPLY</text>
<rect x="1367" y="485" width="205" height="20" rx="4" style="fill:#f6f8fb"/>
<text class="zone-label" x="1564" y="499" text-anchor="end" style="fill:#5b6b7f">2 · ONE RECONCILE PASS</text>
<rect x="1470" y="951" width="102" height="20" rx="4" style="fill:#f6f8fb"/>
<text class="zone-label" x="1564" y="965" text-anchor="end" style="fill:#5b6b7f">3 · ATTACH</text>

