<rect class="box box-host" x="600" y="148" width="170" height="44" rx="8"/>
<text class="h-sm" x="685" y="167" text-anchor="middle">Agent controller</text>
<text class="s-sm" x="685" y="183" text-anchor="middle">reconciles Agents</text>
<rect class="box box-host" x="795" y="148" width="170" height="44" rx="8"/>
<text class="h-sm" x="880" y="167" text-anchor="middle">Session controller</text>
<text class="s-sm" x="880" y="183" text-anchor="middle">reconciles Sessions</text>
<rect class="box box-host" x="990" y="148" width="170" height="44" rx="8"/>
<text class="h-sm" x="1075" y="167" text-anchor="middle">Sandbox Provider</text>
<text class="s-sm" x="1075" y="183" text-anchor="middle">sandbox-microsandbox</text>
<rect class="box box-ext" x="1185" y="148" width="170" height="44" rx="8"/>
<text class="h-sm" x="1270" y="167" text-anchor="middle">Image source</text>
<text class="s-sm" x="1270" y="183" text-anchor="middle">Docker API or registry</text>
<rect class="box box-sandbox" x="1380" y="148" width="170" height="44" rx="8"/>
<text class="h-sm" x="1465" y="167" text-anchor="middle">msb and the guest</text>
<text class="s-sm" x="1465" y="183" text-anchor="middle">one per Sandbox</text>
<path class="lifeline" d="M100,192 V1159"/>
<path class="lifeline" d="M295,192 V1159"/>
<path class="lifeline" d="M490,192 V1159"/>
