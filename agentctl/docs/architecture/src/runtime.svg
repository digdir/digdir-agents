<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
<!-- @shared -->
<rect class="canvas" width="1600" height="1040"/>

<text class="kicker" x="40" y="48">AGENT PLATFORM · RUNTIME</text>
<text class="title" x="40" y="82">What runs where</text>
<text class="subtitle" x="40" y="106">agentctl talks to one agentd per user. agentd keeps the desired state and runs one msb process per Sandbox; the guest only ever reaches the network through it.</text>

<!-- Zones -->
<rect class="zone zone-host" x="40" y="125" width="1100" height="845" rx="16"/>
<text class="zone-label zone-host-label" x="62" y="150">HOST · TRUSTED</text>
<rect class="zone zone-ext" x="1180" y="125" width="380" height="845" rx="16"/>
<text class="zone-label zone-ext-label" x="1202" y="150">INTERNET</text>

<!-- agentctl -->
<rect class="box box-host" x="70" y="165" width="260" height="120" rx="10"/>
<text class="h" x="90" y="194">agentctl</text>
<text class="s" x="90" y="215">CLI and TUI. Starts agentd on</text>
<text class="s" x="90" y="232">demand; holds no state itself.</text>
<text class="code" x="90" y="262">apply · get · attach · tui</text>

<!-- agentd -->
<rect class="zone zone-proc" x="420" y="165" width="690" height="385" rx="12"/>
<text class="zone-label zone-proc-label" x="440" y="189">AGENTD · CONTROL PLANE · ONE PROCESS PER USER</text>

<rect class="box box-host" x="445" y="205" width="200" height="78" rx="10"/>
<text class="h" x="463" y="232">Control API</text>
<text class="s" x="463" y="251">versioned, local only</text>
<text class="code-sm" x="463" y="270">agents.v1 · sessions.v1</text>

<rect class="box box-host" x="665" y="205" width="200" height="78" rx="10"/>
<text class="h" x="683" y="232">Agent controller</text>
<text class="s" x="683" y="251">image, Sandbox, network,</text>
<text class="s" x="683" y="268">setup and release</text>

<rect class="box box-host" x="885" y="205" width="200" height="78" rx="10"/>
<text class="h" x="903" y="232">Session controller</text>
<text class="s" x="903" y="251">tmux and the harness</text>
<text class="s" x="903" y="268">for each Session</text>

<rect class="box store" x="445" y="315" width="200" height="78" rx="10"/>
<g transform="translate(463 329)">
  <path d="M0,4 C0,-1 18,-1 18,4 L18,18 C18,23 0,23 0,18 Z" fill="#e3effb" stroke="#0062ba" stroke-width="1.2"/>
  <path d="M0,4 C0,9 18,9 18,4" fill="none" stroke="#0062ba" stroke-width="1.2"/>
</g>
<text class="h" x="490" y="342">agent.db</text>
<text class="s" x="463" y="364">desired state, Sessions and</text>
<text class="s" x="463" y="381">secrets · SQLite, owner only</text>

<rect class="box box-host" x="665" y="315" width="200" height="78" rx="10"/>
<text class="h" x="683" y="342">Sandbox Provider</text>
<text class="code-sm" x="683" y="361">sandbox-microsandbox</text>
<text class="s" x="683" y="381">Sandbox SDK backend</text>

<rect class="box box-host" x="885" y="315" width="200" height="78" rx="10"/>
<text class="h" x="903" y="342">Platform API</text>
<text class="s" x="903" y="361">Session hooks from the guest</text>
<text class="code-sm" x="903" y="381">POST /v1/session/hooks</text>

<rect class="box box-host" x="445" y="425" width="200" height="78" rx="10"/>
<text class="h" x="463" y="452">Harness adapters</text>
<text class="s" x="463" y="471">Claude Code · Codex</text>
<text class="s" x="463" y="488">login, hooks, launch</text>

<rect class="box box-secret" x="885" y="425" width="200" height="78" rx="10"/>
<text class="h" x="903" y="452">Network policy</text>
<text class="code-sm" x="903" y="471">sandbox-authorization</text>
<text class="s" x="903" y="490">fails closed</text>

<!-- msb process -->
<rect class="zone zone-proc" x="70" y="590" width="1040" height="360" rx="12"/>
<text class="zone-label zone-proc-label" x="128" y="614">MSB · ONE PROCESS PER SANDBOX</text>

<rect class="box box-host" x="95" y="635" width="220" height="80" rx="10"/>
<text class="h" x="113" y="662">Agent relay</text>
<text class="s" x="113" y="682">host IPC to guest agentd</text>
<text class="s" x="113" y="699">over virtio-console</text>

<rect class="box box-host" x="95" y="735" width="220" height="80" rx="10"/>
<text class="h" x="113" y="762">libkrun VMM</text>
<text class="s" x="113" y="782">hardware virtualization</text>
<text class="code-sm" x="113" y="801">KVM · HVF · WHP</text>

<rect class="box box-host" x="95" y="835" width="220" height="80" rx="10"/>
<text class="h" x="113" y="862">libkrunfw</text>
<text class="s" x="113" y="882">the guest Linux kernel,</text>
<text class="s" x="113" y="899">loaded as a library</text>

<!-- Guest -->
<rect class="zone zone-sandbox" x="340" y="625" width="450" height="300" rx="12"/>
<text class="zone-label zone-sandbox-label" x="360" y="650">SANDBOX · LINUX MICROVM · UNTRUSTED</text>

<rect class="box box-sandbox" x="360" y="665" width="200" height="62" rx="9"/>
<text class="h-sm" x="376" y="690">guest agentd · PID 1</text>
<text class="s-sm" x="376" y="709">hands PID 1 to the image</text>

<rect class="box box-sandbox" x="580" y="665" width="190" height="62" rx="9"/>
<text class="h-sm" x="596" y="690">systemd</text>
<text class="s-sm" x="596" y="709">image init and units</text>

<rect class="box box-sandbox" x="360" y="745" width="275" height="110" rx="9"/>
<text class="h-sm" x="376" y="768">tmux server</text>
<rect class="box box-session" x="374" y="780" width="120" height="62" rx="8"/>
<text class="h-sm" x="388" y="804">Session</text>
<text class="s-sm" x="388" y="823">Claude Code</text>
<rect class="box box-session" x="503" y="780" width="120" height="62" rx="8"/>
<text class="h-sm" x="517" y="804">Session</text>
<text class="s-sm" x="517" y="823">Codex</text>

<rect class="box box-sandbox" x="650" y="745" width="120" height="32" rx="7"/>
<text class="h-sm" x="664" y="766">sshd <tspan class="code-sm">:2222</tspan></text>
<rect class="box box-sandbox" x="650" y="784" width="120" height="32" rx="7"/>
<text class="h-sm" x="664" y="805">VNC <tspan class="code-sm">:5900</tspan></text>
<rect class="box box-sandbox" x="650" y="823" width="120" height="32" rx="7"/>
<text class="h-sm" x="664" y="844">Podman</text>

<rect class="box box-sandbox" x="360" y="870" width="410" height="38" rx="8"/>
<text class="h-sm" x="376" y="894">/home/agent</text>
<text class="s-sm" x="465" y="894">retained root filesystem, Volumes and mounts</text>

<!-- Network engine -->
<rect class="box box-host" x="870" y="635" width="215" height="290" rx="10"/>
<text class="h" x="888" y="662">Network engine</text>
<text class="s" x="888" y="681">smoltcp, inside msb</text>
<g>
  <rect class="tag tag-blue" x="884" y="695" width="187" height="34" rx="7"/>
  <text class="h-sm" x="896" y="716">TCP/IP</text>
  <text class="code-sm" x="1061" y="716" text-anchor="end">network.connect</text>
  <rect class="tag tag-blue" x="884" y="740" width="187" height="34" rx="7"/>
  <text class="h-sm" x="896" y="761">DNS</text>
  <text class="code-sm" x="1061" y="761" text-anchor="end">dns.query</text>
  <rect class="tag tag-blue" x="884" y="785" width="187" height="34" rx="7"/>
  <text class="h-sm" x="896" y="806">HTTPS</text>
  <text class="code-sm" x="1061" y="806" text-anchor="end">http.request</text>
  <rect class="tag tag-coral" x="884" y="830" width="187" height="34" rx="7"/>
  <text class="h-sm" x="896" y="851">Real secret in</text>
  <text class="code-sm" x="1061" y="851" text-anchor="end" style="fill:#b3262b">secret.use</text>
  <rect class="tag tag-green" x="884" y="875" width="187" height="34" rx="7"/>
  <text class="h-sm" x="896" y="896">New TLS to the host</text>
</g>

<!-- Internet -->
<rect class="box box-ext" x="1205" y="175" width="330" height="70" rx="10"/>
<text class="h" x="1223" y="203">Model providers</text>
<text class="s" x="1223" y="225">Anthropic and OpenAI APIs</text>
<rect class="box box-ext" x="1205" y="265" width="330" height="70" rx="10"/>
<text class="h" x="1223" y="293">GitHub</text>
<text class="s" x="1223" y="315">git and API, with a mediated token</text>
<rect class="box box-ext" x="1205" y="355" width="330" height="70" rx="10"/>
<text class="h" x="1223" y="383">OCI registries</text>
<text class="s" x="1223" y="405">pulls from the guest, and by agentd</text>
<rect class="box box-ext" x="1205" y="445" width="330" height="70" rx="10"/>
<text class="h" x="1223" y="473">Other hosts</text>
<text class="s" x="1223" y="495">allowed unless the manifest denies them</text>

<rect class="box box-ext" x="1205" y="600" width="330" height="88" rx="10"/>
<text class="h" x="1223" y="628">digdir/microsandbox releases</text>
<text class="s" x="1223" y="650">msb and libkrunfw, downloaded by</text>
<text class="s" x="1223" y="667">agentd on first use, SHA-256 pinned</text>

<rect class="box box-secret" x="1205" y="830" width="330" height="96" rx="10"/>
<text class="h" x="1223" y="858">Denied</text>
<text class="s" x="1223" y="879">the host network, except the Platform API</text>
<text class="s" x="1223" y="896">hosts in <tspan class="code-sm" style="fill:#b3262b">network.deny</tspan></text>
<text class="s" x="1223" y="913">secrets toward any other host</text>

<!-- Edges -->
<path class="edge" d="M330,244 H441" marker-end="url(#arrow)"/>
<text class="code-sm" x="342" y="232">JSON-RPC</text>
<text class="s-sm" x="342" y="262">agentd.sock</text>

<path class="edge-blue dashed" d="M110,285 V631" marker-end="url(#arrow-blue)"/>
<rect class="label-bg" x="120" y="418" width="200" height="56" rx="4"/>
<text class="code-sm" x="126" y="434">attach · exec · ssh · vnc</text>
<text class="s-sm" x="126" y="452">terminals and port forwards</text>
<text class="s-sm" x="126" y="468">go straight to msb</text>

<path class="edge" d="M545,283 V311" marker-end="url(#arrow)"/>
<path class="edge" d="M645,244 H661" marker-end="url(#arrow)"/>
<path class="edge" d="M765,283 V311" marker-end="url(#arrow)"/>
<path class="edge" d="M985,283 V299 H830 V311" marker-end="url(#arrow)"/>

<path class="edge" d="M765,393 V586" marker-end="url(#arrow)"/>
<rect class="label-bg" x="773" y="526" width="96" height="22" rx="4"/>
<text class="s-sm" x="779" y="541">starts and stops</text>
<rect class="label-bg" x="773" y="557" width="96" height="22" rx="4"/>
<text class="s-sm" x="779" y="572">runs Executions</text>

<path class="edge-coral" d="M985,507 V631" marker-start="url(#arrow-coral)" marker-end="url(#arrow-coral)"/>
<rect class="label-bg" x="993" y="548" width="140" height="38" rx="4"/>
<text class="code-sm" x="998" y="562" style="fill:#b3262b">network-control.v3</text>
<text class="s-sm" x="998" y="579">authorizes each flow</text>

<path class="edge" d="M315,696 H356" marker-end="url(#arrow)"/>
<path class="edge" d="M315,775 H336" marker-end="url(#arrow)"/>

<path class="edge-blue" d="M790,712 H866" marker-end="url(#arrow-blue)"/>
<text class="code-sm" x="830" y="702" text-anchor="middle">virtio-net</text>

<path class="edge-green" d="M1085,892 H1160 V210 H1201" marker-end="url(#arrow-green)"/>
<path class="edge-green" d="M1160,300 H1201" marker-end="url(#arrow-green)"/>
<path class="edge-green" d="M1160,390 H1201" marker-end="url(#arrow-green)"/>
<path class="edge-green" d="M1160,480 H1201" marker-end="url(#arrow-green)"/>
<path class="blocked" d="M1085,912 H1196" marker-end="url(#stop)"/>

<!-- Legend -->
<g transform="translate(40 995)">
  <rect class="zone zone-host" x="0" y="-11" width="22" height="14" rx="3"/>
  <text class="legend" x="30" y="0">trusted host</text>
  <rect class="zone zone-sandbox" x="130" y="-11" width="22" height="14" rx="3"/>
  <text class="legend" x="160" y="0">untrusted Sandbox</text>
  <rect class="zone zone-proc" x="295" y="-11" width="22" height="14" rx="3"/>
  <text class="legend" x="325" y="0">host process</text>
  <path class="edge" d="M430,-4 H462" marker-end="url(#arrow)"/>
  <text class="legend" x="472" y="0">control</text>
  <path class="edge-blue dashed" d="M540,-4 H572" marker-end="url(#arrow-blue)"/>
  <text class="legend" x="582" y="0">client data path</text>
  <path class="edge-green" d="M700,-4 H732" marker-end="url(#arrow-green)"/>
  <text class="legend" x="742" y="0">mediated egress</text>
  <path class="edge-coral" d="M865,-4 H897" marker-end="url(#arrow-coral)"/>
  <text class="legend" x="907" y="0">policy decision</text>
</g>
</svg>
