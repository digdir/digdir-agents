<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010">
<style>
/* The same stylesheet is in every diagram; change it in all of them. Colours follow the Digdir palette used by the slides.
   Arial and its metric twins (Helvetica, Liberation Sans) render text at the same width everywhere. */
svg { font-family: Arial, Helvetica, "Liberation Sans", sans-serif; color: #1e2b3c; }
.canvas { fill: #ffffff; }
.mono, .code, .code-sm { font-family: Menlo, Consolas, "Liberation Mono", monospace; }

/* Text */
.title { font-size: 26px; font-weight: 700; fill: #1e2b3c; letter-spacing: -0.02em; }
.subtitle { font-size: 14px; fill: #5b6b7f; }
.kicker { font-size: 11.5px; font-weight: 650; letter-spacing: 0.14em; fill: #0062ba; }
.zone-label { font-size: 11.5px; font-weight: 650; letter-spacing: 0.12em; }
.h { font-size: 15px; font-weight: 650; fill: #1e2b3c; }
.h-sm { font-size: 13px; font-weight: 650; fill: #1e2b3c; }
.s { font-size: 12.5px; fill: #5b6b7f; }
.s-sm { font-size: 11.5px; fill: #5b6b7f; }
.code { font-size: 11.5px; font-weight: 500; fill: #0b4f8f; }
.code-sm { font-size: 10.5px; font-weight: 500; fill: #0b4f8f; }
.label { font-size: 11.5px; font-weight: 550; fill: #3b4b5f; }
.label-bg { fill: #ffffff; }
.step { font-size: 11px; font-weight: 700; fill: #ffffff; }
.legend { font-size: 12px; fill: #3b4b5f; }

/* Zones: trust domains and process boundaries */
.zone { stroke-width: 1.5; }
.zone-host { fill: #f1f7fd; stroke: #0062ba; }
.zone-host-label { fill: #0062ba; }
.zone-sandbox { fill: #fdf7e6; stroke: #c48a0a; stroke-dasharray: 7 5; }
.zone-sandbox-label { fill: #9a6a00; }
.zone-ext { fill: #f4f6f9; stroke: #93a4b8; }
.zone-ext-label { fill: #5b6b7f; }
.zone-proc { fill: #ffffff; fill-opacity: 0.6; stroke: #7d9bbd; stroke-dasharray: 3 4; }
.zone-proc-label { fill: #4a6585; }

/* Boxes */
.box { fill: #ffffff; stroke: #c9d3df; stroke-width: 1; filter: url(#shadow); }
.box-host { fill: #ffffff; stroke: #8db7e3; }
.box-sandbox { fill: #ffffff; stroke: #e3c06a; }
.box-session { fill: #edf8f2; stroke: #3fb27f; }
.box-secret { fill: #fdeff0; stroke: #f45f63; }
.box-ext { fill: #ffffff; stroke: #b8c4d2; }
.box-accent { fill: #0062ba; stroke: #0062ba; }
.box-accent-text { fill: #ffffff; }
.box-accent-sub { fill: #cfe3f7; }
.store { fill: #ffffff; stroke: #8db7e3; stroke-width: 1; }

/* Small rounded tags */
.tag { stroke-width: 1; }
.tag-blue { fill: #e3effb; stroke: #a8c9ec; }
.tag-amber { fill: #fbefcf; stroke: #ebcb7a; }
.tag-coral { fill: #fde4e5; stroke: #f5a5a7; }
.tag-green { fill: #dcf3e7; stroke: #96d6b6; }
.tag-gray { fill: #eef1f5; stroke: #cdd6e0; }
.tag-text { font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; }
.tag-text-blue { fill: #0b4f8f; }
.tag-text-amber { fill: #8a5e00; }
.tag-text-coral { fill: #b3262b; }
.tag-text-green { fill: #1f7a52; }
.tag-text-gray { fill: #4a5b70; }

/* Edges */
.edge { fill: none; stroke: #4a5b70; stroke-width: 1.6; }
.edge-blue { fill: none; stroke: #0062ba; stroke-width: 1.8; }
.edge-coral { fill: none; stroke: #e0474c; stroke-width: 1.8; }
.edge-green { fill: none; stroke: #2e9467; stroke-width: 1.8; }
.edge-amber { fill: none; stroke: #c48a0a; stroke-width: 1.8; }
.edge-muted { fill: none; stroke: #93a4b8; stroke-width: 1.4; stroke-dasharray: 5 4; }
.dashed { stroke-dasharray: 6 4; }
.blocked { fill: none; stroke: #e0474c; stroke-width: 1.8; stroke-dasharray: 2 4; }

/* Step badges for sequences */
.badge { fill: #0062ba; }
.badge-coral { fill: #e0474c; }
.lifeline { stroke: #b8c4d2; stroke-width: 1.2; stroke-dasharray: 4 5; }
.activation { fill: #e3effb; stroke: #8db7e3; }
.divider { stroke: #dfe5ec; stroke-width: 1; }
</style>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1e2b3c" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#4a5b70"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#0062ba"/>
  </marker>
  <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#e0474c"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#2e9467"/>
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#c48a0a"/>
  </marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.8 L9.2,5 L0,9.2 Z" fill="#93a4b8"/>
  </marker>
  <marker id="stop" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="11" markerHeight="11">
    <path d="M2,2 L10,10 M10,2 L2,10" stroke="#e0474c" stroke-width="2.4" stroke-linecap="round"/>
  </marker>
</defs>
<rect class="canvas" width="1600" height="1010"/>

<text class="kicker" x="40" y="48">AGENT PLATFORM · CRATES</text>
<text class="title" x="40" y="82">Two layers, one direction</text>
<text class="subtitle" x="40" y="106">The Agent layer builds on a generic Sandbox SDK. The SDK knows nothing about Agents, so CI runners and other isolated workloads can use it too.</text>

<!-- Agent layer -->
<rect class="zone zone-host" x="40" y="130" width="1070" height="300" rx="16"/>
<text class="zone-label zone-host-label" x="62" y="155">AGENT LAYER</text>

<rect class="box box-host" x="70" y="170" width="1010" height="240" rx="12"/>
<text class="h" x="92" y="199">agent</text>
<text class="code" x="146" y="199">agentctl/</text>
<rect class="tag tag-blue" x="830" y="182" width="232" height="24" rx="12"/>
<text class="tag-text tag-text-blue" x="946" y="198" text-anchor="middle">BINARIES: AGENTCTL · AGENTD</text>
<text class="s" x="92" y="220">Agent resources, the control plane and its API, Harness Adapters, the CLI and the TUI.</text>

<g>
  <rect class="tag tag-gray" x="90" y="237" width="235" height="50" rx="8"/>
  <text class="code" x="104" y="257">control_api</text>
  <text class="s-sm" x="104" y="276">local JSON-RPC server and client</text>
  <rect class="tag tag-gray" x="335" y="237" width="235" height="50" rx="8"/>
  <text class="code" x="349" y="257">control_plane</text>
  <text class="s-sm" x="349" y="276">Agents, reconciler, convergence</text>
  <rect class="tag tag-gray" x="580" y="237" width="235" height="50" rx="8"/>
  <text class="code" x="594" y="257">controller</text>
  <text class="s-sm" x="594" y="276">keyed reconciliation scheduler</text>
  <rect class="tag tag-gray" x="825" y="237" width="235" height="50" rx="8"/>
  <text class="code" x="839" y="257">sessions</text>
  <text class="s-sm" x="839" y="276">Session controller, tmux runtime</text>

  <rect class="tag tag-gray" x="90" y="295" width="235" height="50" rx="8"/>
  <text class="code" x="104" y="315">harness</text>
  <text class="s-sm" x="104" y="334">Claude Code and Codex adapters</text>
  <rect class="tag tag-gray" x="335" y="295" width="235" height="50" rx="8"/>
  <text class="code" x="349" y="315">persistence</text>
  <text class="s-sm" x="349" y="334">SQLite: Agents, Sessions, secrets</text>
  <rect class="tag tag-gray" x="580" y="295" width="235" height="50" rx="8"/>
  <text class="code" x="594" y="315">sandbox</text>
  <text class="s-sm" x="594" y="334">Provider selection, guest setup</text>
  <rect class="tag tag-gray" x="825" y="295" width="235" height="50" rx="8"/>
  <text class="code" x="839" y="315">authorization</text>
  <text class="s-sm" x="839" y="334">the Agent's network policy</text>

  <rect class="tag tag-gray" x="90" y="353" width="235" height="50" rx="8"/>
  <text class="code" x="104" y="373">platform_api</text>
  <text class="s-sm" x="104" y="392">HTTP endpoint for the guest</text>
  <rect class="tag tag-gray" x="335" y="353" width="235" height="50" rx="8"/>
  <text class="code" x="349" y="373">progress</text>
  <text class="s-sm" x="349" y="392">provisioning state per Agent</text>
  <rect class="tag tag-gray" x="580" y="353" width="235" height="50" rx="8"/>
  <text class="code" x="594" y="373">ssh · vnc</text>
  <text class="s-sm" x="594" y="392">access into the guest</text>
  <rect class="tag tag-gray" x="825" y="353" width="235" height="50" rx="8"/>
  <text class="code" x="839" y="373">manifest</text>
  <text class="s-sm" x="839" y="392">agent.yaml and validation</text>
</g>

<!-- Sandbox layer -->
<rect class="zone zone-sandbox" x="40" y="465" width="1070" height="300" rx="16" style="stroke-dasharray:none"/>
<text class="zone-label zone-sandbox-label" x="175" y="490">SANDBOX LAYER · NO AGENT CONCEPTS</text>

<rect class="box box-sandbox" x="250" y="505" width="650" height="95" rx="12"/>
<text class="h" x="272" y="533">sandbox-microsandbox</text>
<text class="code" x="450" y="533">sandbox/microsandbox/</text>
<text class="s" x="272" y="553">The Microsandbox implementation of the SDK's contracts.</text>
<g>
  <rect class="tag tag-amber" x="270" y="564" width="145" height="24" rx="12"/>
  <text class="tag-text tag-text-amber" x="342" y="580" text-anchor="middle">SANDBOX BACKEND</text>
  <rect class="tag tag-amber" x="423" y="564" width="130" height="24" rx="12"/>
  <text class="tag-text tag-text-amber" x="488" y="580" text-anchor="middle">IMAGE BACKEND</text>
  <rect class="tag tag-amber" x="561" y="564" width="148" height="24" rx="12"/>
  <text class="tag-text tag-text-amber" x="635" y="580" text-anchor="middle">NETWORK BACKEND</text>
  <rect class="tag tag-amber" x="717" y="564" width="165" height="24" rx="12"/>
  <text class="tag-text tag-text-amber" x="799" y="580" text-anchor="middle">GUEST TCP · HEARTBEAT</text>
</g>

<rect class="box box-sandbox" x="70" y="645" width="530" height="100" rx="12"/>
<text class="h" x="92" y="673">sandbox</text>
<text class="code" x="160" y="673">sandbox/core/</text>
<text class="s" x="92" y="693">The generic SDK: contracts and types, no Backend.</text>
<g>
  <rect class="tag tag-amber" x="90" y="707" width="85" height="24" rx="12"/>
  <text class="tag-text tag-text-amber" x="132" y="723" text-anchor="middle">PROVIDER</text>
  <rect class="tag tag-amber" x="182" y="707" width="95" height="24" rx="12"/>
  <text class="tag-text tag-text-amber" x="229" y="723" text-anchor="middle">EXECUTION</text>
  <rect class="tag tag-amber" x="284" y="707" width="135" height="24" rx="12"/>
  <text class="tag-text tag-text-amber" x="351" y="723" text-anchor="middle">NETWORK ENDPOINT</text>
  <rect class="tag tag-amber" x="426" y="707" width="105" height="24" rx="12"/>
  <text class="tag-text tag-text-amber" x="478" y="723" text-anchor="middle">SECRETSTORE</text>
  <rect class="tag tag-amber" x="538" y="707" width="48" height="24" rx="12"/>
  <text class="tag-text tag-text-amber" x="562" y="723" text-anchor="middle">…</text>
</g>

<rect class="box box-secret" x="680" y="645" width="400" height="100" rx="12"/>
<text class="h" x="702" y="673">sandbox-authorization</text>
<text class="code" x="900" y="673">sandbox/authorization/</text>
<text class="s" x="702" y="693">Policy vocabulary for Sandbox-originated work.</text>
<g>
  <rect class="tag tag-coral" x="700" y="707" width="110" height="24" rx="12"/>
  <text class="tag-text tag-text-coral" x="755" y="723" text-anchor="middle">POLICYENGINE</text>
  <rect class="tag tag-coral" x="817" y="707" width="205" height="24" rx="12"/>
  <text class="tag-text tag-text-coral" x="919" y="723" text-anchor="middle">AUTHORIZATIONREQUEST</text>
</g>

<!-- External -->
<rect class="zone zone-ext" x="40" y="800" width="1070" height="165" rx="16"/>
<text class="zone-label zone-ext-label" x="62" y="825">EXTERNAL · PINNED</text>

<rect class="box box-ext" x="70" y="840" width="250" height="105" rx="10" style="stroke-dasharray:5 4"/>
<text class="h" x="90" y="867">msb + libkrunfw</text>
<text class="s" x="90" y="888">the runtime bundle, not a crate:</text>
<text class="s" x="90" y="905">downloaded on first use and</text>
<text class="s" x="90" y="922">checked against SHA-256 pins</text>

<rect class="box box-ext" x="350" y="840" width="300" height="105" rx="10"/>
<text class="h" x="370" y="867">Microsandbox fork crates</text>
<text class="code-sm" x="370" y="888">microsandbox · -image · -network</text>
<text class="s" x="370" y="908">digdir/microsandbox, git rev</text>
<text class="s" x="370" y="925">tagged v0.7.4-digdir.3</text>

<rect class="box box-ext" x="680" y="840" width="190" height="105" rx="10"/>
<text class="h" x="700" y="867">bollard</text>
<text class="s" x="700" y="888">Docker Engine API</text>
<text class="s" x="700" y="905">for image builds</text>

<rect class="box box-ext" x="890" y="840" width="190" height="105" rx="10"/>
<text class="h" x="910" y="867">rusqlite</text>
<text class="s" x="910" y="888">agent.db</text>

<!-- Edges: depends on -->
<path class="edge" d="M575,410 V501" marker-end="url(#arrow)"/>
<path class="edge" d="M150,410 V641" marker-end="url(#arrow)"/>
<path class="edge" d="M1000,410 V641" marker-end="url(#arrow)"/>
<path class="edge" d="M400,600 V641" marker-end="url(#arrow)"/>
<path class="edge" d="M800,600 V641" marker-end="url(#arrow)"/>
<path class="edge" d="M640,600 V812 H500 V836" marker-end="url(#arrow)"/>
<path class="edge" d="M640,812 H775 V836" marker-end="url(#arrow)"/>
<path class="edge" d="M1080,300 H1095 V812 H985 V836" marker-end="url(#arrow)"/>
<path class="edge-muted" d="M350,892 H324" marker-end="url(#arrow-muted)"/>

<!-- Rules -->
<rect class="box" x="1145" y="130" width="415" height="835" rx="16" style="fill:#f8fafc"/>
<text class="kicker" x="1170" y="162">RULES FROM AGENTCTL/AGENTS.MD</text>

<g class="s">
  <circle class="badge" cx="1182" cy="196" r="11"/><text class="step" x="1182" y="200" text-anchor="middle">1</text>
  <text x="1204" y="193"><tspan class="h-sm">Dependencies point down only.</tspan></text>
  <text x="1204" y="213">The Sandbox crates never depend on Agent</text>
  <text x="1204" y="230">automation.</text>

  <circle class="badge" cx="1182" cy="270" r="11"/><text class="step" x="1182" y="274" text-anchor="middle">2</text>
  <text x="1204" y="267"><tspan class="h-sm">The SDK has no Backend.</tspan></text>
  <text x="1204" y="287"><tspan class="code-sm">sandbox-microsandbox</tspan> depends on <tspan class="code-sm">sandbox</tspan>,</text>
  <text x="1204" y="304">never the reverse.</text>

  <circle class="badge" cx="1182" cy="344" r="11"/><text class="step" x="1182" y="348" text-anchor="middle">3</text>
  <text x="1204" y="341"><tspan class="h-sm">Authorization stands alone.</tspan></text>
  <text x="1204" y="361"><tspan class="code-sm">sandbox-authorization</tspan> depends on no</text>
  <text x="1204" y="378">enforcement point, control plane or SDK.</text>

  <circle class="badge" cx="1182" cy="418" r="11"/><text class="step" x="1182" y="422" text-anchor="middle">4</text>
  <text x="1204" y="415"><tspan class="h-sm">Network is chosen separately.</tspan></text>
  <text x="1204" y="435">A Network Backend is selected independently</text>
  <text x="1204" y="452">of the Sandbox Backend, and the attachment</text>
  <text x="1204" y="469">is fixed for the Sandbox's lifetime.</text>

  <circle class="badge" cx="1182" cy="509" r="11"/><text class="step" x="1182" y="513" text-anchor="middle">5</text>
  <text x="1204" y="506"><tspan class="h-sm">No unobserved egress.</tspan></text>
  <text x="1204" y="526">A Sandbox Backend blocks all traffic its</text>
  <text x="1204" y="543">selected endpoint does not represent.</text>

  <circle class="badge" cx="1182" cy="583" r="11"/><text class="step" x="1182" y="587" text-anchor="middle">6</text>
  <text x="1204" y="580"><tspan class="h-sm">Live decisions, not static policy.</tspan></text>
  <text x="1204" y="600">Network implementations ask</text>
  <text x="1204" y="617"><tspan class="code-sm">sandbox-authorization</tspan>; the Sandbox</text>
  <text x="1204" y="634">contract has no <tspan class="code-sm">NetworkPolicy</tspan>.</text>

  <circle class="badge" cx="1182" cy="674" r="11"/><text class="step" x="1182" y="678" text-anchor="middle">7</text>
  <text x="1204" y="671"><tspan class="h-sm">Secrets stay on the host.</tspan></text>
  <text x="1204" y="691">Agent secrets reach the network only</text>
  <text x="1204" y="708">through mediated access.</text>

  <circle class="badge" cx="1182" cy="748" r="11"/><text class="step" x="1182" y="752" text-anchor="middle">8</text>
  <text x="1204" y="745"><tspan class="h-sm">One thread for control-plane state.</tspan></text>
  <text x="1204" y="765">Tokio's <tspan class="code-sm">LocalRuntime</tspan>, with <tspan class="code-sm">Rc</tspan> and</text>
  <text x="1204" y="782"><tspan class="code-sm">RefCell</tspan>; never <tspan class="code-sm">Arc</tspan> or <tspan class="code-sm">Mutex</tspan>.</text>

  <circle class="badge" cx="1182" cy="822" r="11"/><text class="step" x="1182" y="826" text-anchor="middle">9</text>
  <text x="1204" y="819"><tspan class="h-sm">Crates are boundaries, not folders.</tspan></text>
  <text x="1204" y="839">Add a crate only for an independent</text>
  <text x="1204" y="856">dependency, versioning or distribution</text>
  <text x="1204" y="873">boundary; organize inside with modules.</text>
</g>

<!-- Legend -->
<g transform="translate(40 993)">
  <path class="edge" d="M0,-4 H32" marker-end="url(#arrow)"/>
  <text class="legend" x="42" y="0">depends on</text>
  <path class="edge-muted" d="M140,-4 H172" marker-end="url(#arrow-muted)"/>
  <text class="legend" x="182" y="0">spawns at runtime</text>
</g>
</svg>
