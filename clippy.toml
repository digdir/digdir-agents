allow-expect-in-consts = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-consts = true
allow-unwrap-in-tests = true
disallowed-methods = [
  { path = "tokio::task::spawn_blocking", reason = "run it with `sandbox::blocking::run`, which limits it and lets it stop" },
  { path = "tokio::runtime::Handle::spawn_blocking", reason = "run it with `sandbox::blocking::run`, which limits it and lets it stop" },
  { path = "std::thread::spawn", reason = "run blocking work with `sandbox::blocking::run`, which limits it and lets it stop" },
  { path = "std::thread::Builder::spawn", reason = "run blocking work with `sandbox::blocking::run`, which limits it and lets it stop" },
]
