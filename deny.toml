# This policy intentionally contains no per-crate allowlist. New dependencies remain ordinary
# Cargo.toml and Cargo.lock changes.

[graph]
all-features = true
# The targets agentctl is released for.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
ignore = [
  # bincode 2 is unmaintained and has no maintained successor release. Microsandbox and its
  # libkrun crates use it to serialize their own data; the advisory reports no vulnerability.
  { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode 2 used by Microsandbox; no known vulnerability or safe upgrade" },
  # unsafe-libyaml is archived and has no successor release. agentctl uses it through serde_yaml_ng to parse its own
  # agent manifests; the advisory reports no vulnerability. Moving to a safe-Rust YAML parser removes this entry.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained unsafe-libyaml used by serde_yaml_ng; no known vulnerability or safe upgrade" },
  # astral-tokio-tar is unmaintained and has no successor release. Microsandbox uses it to unpack image layers and to
  # write and read snapshot archives; the advisory reports no vulnerability. Moving Microsandbox to another tar crate,
  # such as tar-codec, removes this entry.
  { id = "RUSTSEC-2026-0440", reason = "unmaintained astral-tokio-tar used by Microsandbox; no known vulnerability or safe upgrade" },
  # The SQLite bundled with libsqlite3-sys 0.30 can return stale memory for a database whose -wal file another party
  # wrote with a different page size. agentd and Microsandbox open only their own databases, agent.db and
  # microsandbox/ in agentd's home. rusqlite stays on the libsqlite3-sys the Microsandbox fork resolves, so the fixed
  # 0.39 waits for the fork to move. Moving both removes this entry.
  { id = "RUSTSEC-2026-0459", reason = "SQLite -wal page size; agentd and Microsandbox open only their own databases in agentd's home" },
  # chrono is unmaintained. Its maintainer recommends jiff. Microsandbox keeps its timestamps in it and enables it in
  # sea-orm and sqlx, and oci-client requires it for the image config; the advisory reports no vulnerability. Microsandbox
  # and oci-client moving to jiff or time removes this entry, tracked in
  # https://github.com/digdir/digdir-agents/issues/541.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono used by Microsandbox and oci-client; no known vulnerability or safe upgrade" },
]

[sources]
# crates.io is allowed by default. Additional registries fail until deliberately configured.
unknown-registry = "deny"
# Do not maintain a git repository allowlist, but require an explicit revision specifier.
unknown-git = "allow"
required-git-spec = "rev"

[licenses]
# The licenses the released binaries may contain. agentctl/notices/about.toml accepts the same list, so a new license
# is a reviewed change to both.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
