# An agent for .NET development: a computer of its own with the .NET SDK, Podman, a desktop with Chromium, Claude
# Code, Codex and Pi, which clones your repositories at boot and works on GitHub without the token ever entering it.
#
# Copy this agent definition, the directory this file is in, to start your own agent. The values here are the ones we
# recommend. Paths in a manifest resolve against the directory it is in, or against your home directory when they
# start with `~/`.
apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  # The agent's name in agentctl's commands and the TUI. `agentctl apply --name` overrides it, so one manifest can
  # create several agents.
  name: dotnet-dev
spec:
  sandbox:
    # The image the sandbox boots. `build` builds the Dockerfile beside this file on the host, which needs a running
    # Docker Engine there. `type: reference` with `reference: <image>` pulls a published image instead.
    image:
      type: build
      context: .
      dockerfile: Dockerfile
    platform:
      os: linux
    # What the sandbox may use of the host.
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        # The most disk the agent can use. Builds, NuGet caches and container images fill it faster than you expect.
        capacity: "100Gi"
        # `direct` copies the whole image onto the agent's own disk. `layered` instead shares the image and stores
        # only what the agent writes on top of it.
        mode: direct
      # Lets the coding agents in this agent run agents of their own, such as one to try a change to an agent before you
      # do. It needs a Linux x86_64 host with nested KVM, or an Apple M3 or newer on macOS 15 or newer. `preferred`
      # starts the agent without them on other hosts, and `required` fails there instead.
      nestedSandboxes: preferred
    # Boot the image's own init system, systemd in the base images. It runs the service that clones the
    # repositories in workspace.list, Podman, and the servers for `access` below.
    initSystem: image

  # A directory copied over /home/agent every time agentd reconciles the agent, for configuration you want to own
  # from here, such as a NuGet.Config. It never deletes files in the sandbox. Here it holds Pi's providers and models.
  home:
    source: home

  # What every harness is told about this computer, installed where each one reads its instructions.
  instructions:
    - source: instructions.md

  # The harnesses sessions can run. Claude Code and Codex log in on the host once, with `agentctl claude login` or
  # `agentctl codex login`, and the sandbox only sees a placeholder for the credential.
  harnesses:
    - type: claudeCode
      # What a new session runs when you do not choose a harness.
      default: true
      # The model and effort new sessions start with, in the harness's own names. `--model` and `--effort` on
      # `agentctl create` override them.
      # defaults:
      #   model: opus
      # The host login this agent's requests carry, stored with `agentctl claude login NAME`, such as one for work
      # and one for a private subscription. A list, or `any` for every stored login, gives the agent the one with
      # the most of its limits left. Without it, the agent uses the login stored without a name.
      # login: work
    - type: codex
      # Without a Codex login on the host, the agent starts without Codex instead of failing. Log in later, and
      # the next reconcile adds it.
      optional: true
    - type: pi
      # Pi has no login of its own. It reaches models through the providers in home/.pi/agent/models.json, here
      # Digdir's AI gateway with the AIVAR_API_KEY secret below. Point it at another provider by changing that file
      # and the secret.
      defaults:
        model: aivar/sigma2:Qwen3.8-27B

  # Plain values copied into the sandbox from the environment file, `.env` beside this file unless
  # `agentctl apply --env-file` names another. The sandbox sees them as they are, so never put a secret here.
  environment:
    - name: GIT_USER_NAME
    - name: GIT_USER_EMAIL

  # Secrets stay on the host. The sandbox sees a placeholder in the variable, and the host puts the real value into
  # requests to the hosts listed, and nowhere else.
  secrets:
    - environment: GITHUB_TOKEN
      # Without a value in the environment file, the agent starts without it, but cannot clone private
      # repositories, push or open pull requests.
      optional: true
      # gh attaches files to pull requests only with a token it recognizes by its prefix, so the placeholder
      # carries the fine-grained token's prefix.
      placeholder: github_pat_AGENT_MEDIATED_GITHUB_TOKEN
      # Git and gh, gists, and the uploads behind `gh pr create --attach`.
      allowedHosts:
        - github.com
        - api.github.com
        - gist.github.com
        - uploads.github.com
    # The key for Digdir's AI gateway, which Pi uses. Without it Pi starts, but rejects every prompt.
    - environment: AIVAR_API_KEY
      optional: true
      allowedHosts:
        - api.aivar.no
    # A private NuGet feed takes another secret with its own host, such as:
    # - environment: AZURE_ARTIFACTS_TOKEN
    #   allowedHosts:
    #     - pkgs.dev.azure.com

  # Ways to reach the agent besides agentctl's sessions.
  access:
    # OpenSSH, for Rider, Visual Studio Code or a terminal of your own. `agentctl ssh-config install` adds the agent
    # to your SSH configuration as `agentctl-dotnet-dev`.
    - type: ssh
    # The desktop, in your browser with `agentctl vnc --web` or in a VNC client, to watch what the agent does there
    # or take over. You share its keyboard and pointer. It needs the desktop image the Dockerfile builds on.
    - type: vnc

  # All traffic leaves through the host, which applies this policy.
  network:
    mode: mediated
    allow: all
    # Hosts the agent may not reach. Google Cloud's metadata service hands out the credentials of the VM it runs on,
    # so block it in case the host is one.
    deny:
      - metadata.google.internal
