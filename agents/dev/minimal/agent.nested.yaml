apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.yaml

metadata:
  name: agentctl-dev-nested

# The published image, reduced to fit inside another agent.
spec:
  sandbox:
    resources:
      cpu: "2"
      memory: "3Gi"
      rootFilesystem:
        capacity: "16Gi"
        mode: direct
      # A nested agent runs no agents of its own.
      nestedSandboxes: null
