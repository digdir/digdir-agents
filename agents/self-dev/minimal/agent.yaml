apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: agentctl-dev
spec:
  sandbox:
    image:
      type: reference
      reference: ghcr.io/digdir/digdir-agents/agentctl-self-dev-minimal:latest
    platform:
      os: linux
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        capacity: "100Gi"
        mode: direct
      # For the Microsandbox runtime that runs nested Agents and the end-to-end tests. A host that
      # cannot provide them leaves the Agent without them, as its NestedSandboxes condition says.
      nestedSandboxes: preferred
    initSystem: image
  home:
    source: ../home
  instructions:
    - source: ../instructions.md
  skills:
    - source: ../skills/pr-evidence
    - source: ../skills/changelog
  harnesses:
    - type: claudeCode
      auth: mediated
      default: true
      defaults:
        model: opus
    # Optional: the Agent is created without Codex when the host has no Codex login, so nobody who only uses
    # Claude Code is blocked. Run `agentctl codex login` and the next convergence installs it.
    - type: codex
      auth: mediated
      optional: true
    # Pi has no platform login: its providers and models come from ~/.pi/agent/models.json in `home`, and the
    # gateway key from the optional AIVAR_API_KEY secret below. Without the key Pi starts, but a prompt's wait times out.
    - type: pi
      defaults:
        model: aivar/sigma2:Qwen3.8-27B
  environment:
    - name: GIT_USER_NAME
    - name: GIT_USER_EMAIL
  secrets:
    - environment: GITHUB_TOKEN
      # gh only attaches files with a token it classifies by prefix; the inert placeholder
      # therefore carries the fine-grained PAT prefix and is far shorter than a real token.
      placeholder: github_pat_AGENT_MEDIATED_GITHUB_TOKEN
      allowedHosts:
        - github.com
        - api.github.com
        - gist.github.com
        - uploads.github.com
    - environment: AIVAR_API_KEY
      optional: true
      allowedHosts:
        - api.aivar.no
  access:
    - type: ssh
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
