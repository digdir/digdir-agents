apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: agentctl-dev
spec:
  sandbox:
    image:
      type: reference
      reference: ghcr.io/digdir/digdir-agents/agentctl-self-dev-full:latest
    platform:
      os: linux
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        capacity: "100Gi"
        mode: direct
      # For the Microsandbox runtime that runs nested agents and the end-to-end tests. A host that
      # cannot provide them leaves the agent without them, as its NestedSandboxes condition says.
      nestedSandboxes: preferred
    initSystem: image
  home:
    source: ../home
  instructions:
    - source: ../instructions.md
    - source: desktop.md
  skills:
    - source: ../skills/pr-evidence
    - source: ../skills/changelog
    # The image ships the computer-use and recording skills.
  harnesses:
    - type: claudeCode
      auth: mediated
      default: true
      # Whichever login you stored, whatever its name. Name one in your variant, such as `login: work`, to keep the
      # agent on it.
      login: any
      defaults:
        model: opus
    # Optional: the agent is created without Codex when the host has no Codex login, so nobody who only uses
    # Claude Code is blocked. Run `agentctl codex login` and the next convergence installs it.
    - type: codex
      auth: mediated
      login: any
      optional: true
    # Pi has no platform login: its providers and models come from ~/.pi/agent/models.json in `home`, and the
    # gateway key from the optional AIVAR_API_KEY secret below. Without the key Pi starts, but a prompt's wait times out.
    - type: pi
      defaults:
        model: aivar/sigma2:Qwen3.8-27B
  # GITHUB_TOKEN and Git's name and email, from `agentctl github login default`.
  accounts:
    - type: github
      login: default
  secrets:
    # From `agentctl secret set aivar --hosts api.aivar.no`.
    - name: aivar
      environment: AIVAR_API_KEY
      optional: true
      allowedHosts:
        - api.aivar.no
  access:
    - type: ssh
    # Enables the image's VNC access units; without it the desktop runs with no port open.
    - type: vnc
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
