d /home/agent 0755 agent agent -
# systemd mounts a fresh tmpfs over /run at boot, so the runtime directory the image creates does
# not survive into a booted agent and is recreated here. The numeric owner is part of the path by
# convention, and agent-image-check asserts that the agent user really is UID 1000.
d /run/user/1000 0700 agent agent -
