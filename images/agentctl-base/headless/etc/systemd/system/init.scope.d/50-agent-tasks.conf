# All guest Executions inherit init.scope, whose default task limit is too low for concurrent
# harnesses. The kernel pid limit remains the Sandbox boundary.
#
# The Sandbox's own guest runtime lives in init.scope too. Under systemd's default
# OOMPolicy=stop, one kernel OOM kill of a Session's build or test run would stop the whole scope
# and take the Sandbox down with it; with `continue` the killed process is the only casualty.
[Scope]
TasksMax=infinity
OOMPolicy=continue
