# The Agent desktop's display, geometry, keyboard and VNC socket, read by the desktop systemd
# units. The image also sets DISPLAY to the same value for every Session. Override a setting in a
# file of your own in /etc/agent-desktop.conf.d/ rather than by editing this one: the units read
# /etc/agent-desktop.conf.d/*.conf after it, in name order, and the last value of a setting wins.
#
# The geometry is Anthropic's 1568-tile image budget at 28 px tiles and sits inside OpenAI's
# recommended 1440-1600 pixel width band: a screenshot of this display costs about 1.5k image
# tokens and is sent without being resized, so the coordinates a model reads off it address the
# pixels it clicks.
AGENT_DESKTOP_DISPLAY=:1
AGENT_DESKTOP_GEOMETRY=1456x819
# The keyboard layout, as setxkbmap arguments, quoted when there is more than one: `no`, or
# `"us -variant intl"`. It is what a person typing over VNC gets; `desktop type` enters any text
# whatever the layout.
AGENT_DESKTOP_KEYBOARD=us
AGENT_DESKTOP_SOCKET=/run/agent-desktop/vnc.sock
# What programs started from the desktop see, as Sessions do through the image's environment: the
# desktop feature's env file explains it.
XDG_CURRENT_DESKTOP=X-Openbox:XFCE
