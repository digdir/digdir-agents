# Builds the self-development agent's images from agents/self-dev on main, and publishes them to
# ghcr.io/digdir/digdir-agents as `latest` and `sha-<commit>`. They develop this repository and are not part of agentctl,
# so they build on the base images as published, like any agent's image, and are published again whenever those are.
# Pull requests do not build them. To try a change before merging it, run this workflow by hand on its branch, which
# builds the images without publishing them.
name: self-dev images

on:
  push:
    branches:
      - main
    paths:
      - agents/self-dev/**
      - .github/workflows/self-dev-images.yml
      - .github/workflows/images.yml
      # This image's .dockerignore does not admit this Markdown. agentctl applies the self-dev agent's from its manifest.
      - '!agents/self-dev/**/*.md'
  # A publish of the base images on main. The run builds main as it is now, which may have moved past the commit that
  # published them.
  workflow_run:
    workflows: [agentctl base images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # A push that also changes the base images leaves the build to the base images' run, which starts this workflow once
  # it has published them. Built now, the images would get the base from before the push.
  plan:
    name: Plan
    if: >-
      ${{ github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Leave the build to the base images if this push changes them
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          build=true
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            # The files agentctl-base-images.yml publishes on, as its push paths list them. Kept in step by hand: a
            # path missing here costs only a build on the old base, which the base images' run then replaces.
            base='^(images/agentctl-base/|\.github/workflows/agentctl-base-images\.yml$)'
            base_docs='^images/agentctl-base/[^/]*\.md$'
            changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" \
              --jq '.files[] | .filename, (.previous_filename // empty)')"
            relevant="$(grep -E "${base}" <<< "${changed}" | grep -v -E "${base_docs}" || true)"
            if [ -n "${relevant}" ]; then
              echo "This push changes the base images; their run builds these images once it has published them"
              build=false
            fi
          fi
          echo "build=${build}" >> "${GITHUB_OUTPUT}"

  # Both images are built in one bake: full is minimal plus the desktop, so it publishes the minimal layers with the
  # same digests, and a host that has minimal only pulls the full layers.
  images:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: Self-dev images
    # On this job rather than the workflow, so that a run that builds nothing never takes the place of a pending one
    # that would. A cancelled publish could leave the two images' tags pointing at different commits.
    concurrency:
      group: self-dev-images-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/images.yml
    with:
      files: agents/self-dev/docker-bake.hcl
      group: self-dev
      set: self-dev-full.cache-from=type=registry,ref=ghcr.io/digdir/digdir-agents/agentctl-self-dev-minimal:buildcache-{arch}
      sparse-checkout: agents/self-dev
      publish: ${{ github.ref == 'refs/heads/main' }}
      images: |
        [
          {
            "target": "self-dev-minimal",
            "repository": "ghcr.io/digdir/digdir-agents/agentctl-self-dev-minimal",
            "cache": "ghcr.io/digdir/digdir-agents/agentctl-self-dev-minimal:buildcache",
            "tags": ["latest", "sha-{sha}"]
          },
          {
            "target": "self-dev-full",
            "repository": "ghcr.io/digdir/digdir-agents/agentctl-self-dev-full",
            "cache": "ghcr.io/digdir/digdir-agents/agentctl-self-dev-full:buildcache",
            "tags": ["latest", "sha-{sha}"]
          }
        ]
