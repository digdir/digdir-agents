# Builds, lints and tests the Rust workspace: agentctl and the Sandbox crates. Called from ci.yml when the workspace
# changes.
name: rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-ng-dev

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      # cache-warm.yml saves this cache from main, where every pull request can restore it, under the same shared key.
      # A cache saved here would be visible to this pull request alone.
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-${{ hashFiles('Makefile', '.github/workflows/cache-warm.yml') }}
          save-if: false

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code -- .

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Test installation and managed upgrade
        run: ./agentctl/installation-test.sh

      - name: Check dependencies
        run: make deps-check

  end-to-end:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hosted Linux runners have /dev/kvm, but only root may open it until a udev rule opens it to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner image provides Docker, Node.js and util-linux script.
      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-ng-dev tmux

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      # The build job's cache: these tests use the dependencies it builds.
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-${{ hashFiles('Makefile', '.github/workflows/cache-warm.yml') }}
          save-if: false

      - name: Run end-to-end tests
        run: make test-e2e

  portable-hosts:
    name: Portable host (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS ARM64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
          - name: Windows ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for git on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-ng-dev

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      # cache-warm.yml saves this cache from main. The key holds the runner's OS and architecture, so each host has its
      # own; it hashes this workflow, which holds the commands below.
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: portable-${{ hashFiles('.github/workflows/rust.yml', '.github/workflows/cache-warm.yml') }}
          save-if: false

      - name: Check native host
        run: >-
          cargo clippy
          -p sandbox
          -p sandbox-authorization
          -p agent
          -p sandbox-microsandbox
          --all-targets --all-features --locked

      - name: Test native host
        run: >-
          cargo test
          -p sandbox
          -p sandbox-authorization
          -p agent
          -p sandbox-microsandbox
          --all-targets --all-features --locked

      - name: Test installation and managed upgrade
        run: ./agentctl/installation-test.sh

  dependencies:
    name: Advisories, sources and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency advisories, sources and licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.99.0'
          arguments: '--locked'
          command: check
          command-arguments: 'advisories sources licenses'
