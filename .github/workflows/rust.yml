# Builds, lints and tests the Rust workspace: agentctl and the Sandbox crates. Called from ci.yml when the workspace
# changes.
name: rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-ng-dev

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Saves only from main, so pull requests share its cache instead of evicting it with their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code -- .

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Test installation and managed upgrade
        run: ./agentctl/installation-test.sh

      - name: Check dependencies
        run: make deps-check

  portable-hosts:
    name: Portable host (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS ARM64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
          - name: Windows ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for git on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-ng-dev

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      - name: Check native host
        run: >-
          cargo clippy
          -p sandbox
          -p sandbox-authorization
          -p agent
          -p sandbox-microsandbox
          --all-targets --all-features --locked

      - name: Test native host
        run: >-
          cargo test
          -p sandbox
          -p sandbox-authorization
          -p agent
          -p sandbox-microsandbox
          --all-targets --all-features --locked

      - name: Test installation and managed upgrade
        run: ./agentctl/installation-test.sh

  dependencies:
    name: Advisories, sources and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency advisories, sources and licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.97.1'
          arguments: '--locked'
          command: check
          command-arguments: 'advisories sources licenses'
