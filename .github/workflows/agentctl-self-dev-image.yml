# Builds the self-development Agent's image from agentctl/examples/self-dev. Pull requests only build and smoke-test
# it; main, including a manual run on main, also publishes it to GHCR as `latest` and `sha-<commit>`.
name: agentctl self-dev image

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - agentctl/examples/self-dev/**
      - .github/workflows/agentctl-self-dev-image.yml
  push:
    branches:
      - main
    paths:
      - agentctl/examples/self-dev/**
      - .github/workflows/agentctl-self-dev-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentctl-self-dev-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/digdir/digdir-agents/agent-self-dev
  CONTEXT: agentctl/examples/self-dev

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build self-dev image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            agentctl/examples/self-dev

      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish image
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -eu

          set --
          if [ "${PUBLISH}" = "true" ]; then
            set -- \
              --tag "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA::10}" \
              --tag "${IMAGE_REPOSITORY}:latest" \
              --push \
              --cache-to "type=registry,ref=${IMAGE_REPOSITORY}:buildcache,mode=max,image-manifest=true"
          fi

          docker buildx build \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --cache-from "type=registry,ref=${IMAGE_REPOSITORY}:buildcache" \
            --platform linux/amd64,linux/arm64 \
            "$@" \
            "${CONTEXT}"

      # The multi-platform build above loads no image. Load the native one separately (fully cached by the step above)
      # and check the tools the Agent's instructions and skills use.
      - name: Smoke test amd64 image
        run: |
          set -eu
          docker buildx build \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --cache-from "type=registry,ref=${IMAGE_REPOSITORY}:buildcache" \
            --platform linux/amd64 \
            --load \
            --tag agent-self-dev:smoke \
            "${CONTEXT}"
          docker run --rm --entrypoint bash agent-self-dev:smoke -c '
            set -eu
            claude --version
            codex --version
            gh --version
            gh stack --help >/dev/null
            shellcheck --version
            actionlint --version
            yq --version
            cargo deny --version
            cargo about --version
            python3 --version
            asciinema --version
            agg --version
            cargo --version
            node --version
          '
