# Builds the self-development Agent's images from agents/self-dev. Pull requests only build them; main,
# including a manual run on main, also publishes them to GHCR as `latest` and `sha-<commit>`.
name: agentctl self-dev images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - agents/self-dev/**
      - .github/workflows/agentctl-self-dev-images.yml
  push:
    branches:
      - main
    paths:
      - agents/self-dev/**
      - .github/workflows/agentctl-self-dev-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentctl-self-dev-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONTEXT: agents/self-dev

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build ${{ matrix.target }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: minimal
            repository: ghcr.io/digdir/digdir-agents/agentctl-self-dev-minimal
          # The full image is one stage on top of minimal, so it warms its build from that image's cache as well as its
          # own and only rebuilds the full layers.
          - target: full
            repository: ghcr.io/digdir/digdir-agents/agentctl-self-dev-full
            extra_cache: ghcr.io/digdir/digdir-agents/agentctl-self-dev-minimal
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            agents/self-dev

      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish image
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          EXTRA_CACHE: ${{ matrix.extra_cache }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu

          set --
          if [ "${PUBLISH}" = "true" ]; then
            set -- \
              --tag "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA::10}" \
              --tag "${IMAGE_REPOSITORY}:latest" \
              --push \
              --cache-to "type=registry,ref=${IMAGE_REPOSITORY}:buildcache,mode=max,image-manifest=true"
          fi
          if [ -n "${EXTRA_CACHE}" ]; then
            set -- "$@" --cache-from "type=registry,ref=${EXTRA_CACHE}:buildcache"
          fi

          docker buildx build \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --cache-from "type=registry,ref=${IMAGE_REPOSITORY}:buildcache" \
            --platform linux/amd64,linux/arm64 \
            --target "${TARGET}" \
            "$@" \
            "${CONTEXT}"
