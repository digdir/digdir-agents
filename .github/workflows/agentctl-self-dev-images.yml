# Builds the self-development Agent's images from agents/self-dev. Pull requests only build them; main,
# including a manual run on main, also publishes them to GHCR as `latest` and `sha-<commit>`.
name: agentctl self-dev images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - agents/self-dev/**
      - .github/workflows/agentctl-self-dev-images.yml
  push:
    branches:
      - main
    paths:
      - agents/self-dev/**
      - .github/workflows/agentctl-self-dev-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentctl-self-dev-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONTEXT: agents/self-dev
  REGISTRY: ghcr.io/digdir/digdir-agents

jobs:
  # Each architecture builds on a native runner: under QEMU, the arm64 build took more than 20 minutes for the
  # package layer alone. On main, each pushes its images by digest, and the publish job joins them into the tagged
  # multi-platform images.
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            agents/self-dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # Both images are built in one job, minimal first: full is minimal plus its own stage, so its build reuses the
      # minimal layers just built and publishes them with the same digests, and a host that has minimal only pulls the
      # full layers.
      - name: Build images
        env:
          ARCH: ${{ matrix.arch }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -eu

          mkdir -p "${RUNNER_TEMP}/digests"
          for target in minimal full; do
            repository="${REGISTRY}/agentctl-self-dev-${target}"
            metadata="${RUNNER_TEMP}/metadata-${target}.json"
            set --
            if [ "${PUBLISH}" = "true" ]; then
              set -- \
                --output "type=image,name=${repository},push-by-digest=true,name-canonical=true,push=true" \
                --metadata-file "${metadata}" \
                --cache-to "type=registry,ref=${repository}:buildcache-${ARCH},mode=max,image-manifest=true"
            fi

            docker buildx build \
              --provenance=false \
              --sbom=false \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --cache-from "type=registry,ref=${REGISTRY}/agentctl-self-dev-minimal:buildcache-${ARCH}" \
              --cache-from "type=registry,ref=${repository}:buildcache-${ARCH}" \
              --platform "linux/${ARCH}" \
              --target "${target}" \
              "$@" \
              "${CONTEXT}"

            if [ "${PUBLISH}" = "true" ]; then
              digest="$(jq -r '."containerimage.digest"' "${metadata}")"
              case "${digest}" in
                sha256:*) printf '%s\n' "${digest}" > "${RUNNER_TEMP}/digests/${target}" ;;
                *) echo "::error::no image digest for ${target} in ${metadata}"; exit 1 ;;
              esac
            fi
          done

      - name: Upload image digests
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Tag multi-platform images
        run: |
          set -eu

          for target in minimal full; do
            repository="${REGISTRY}/agentctl-self-dev-${target}"
            docker buildx imagetools create \
              --tag "${repository}:sha-${GITHUB_SHA::10}" \
              --tag "${repository}:latest" \
              "${repository}@$(cat "${RUNNER_TEMP}/digests/digests-amd64/${target}")" \
              "${repository}@$(cat "${RUNNER_TEMP}/digests/digests-arm64/${target}")"
            docker buildx imagetools inspect "${repository}:sha-${GITHUB_SHA::10}"
          done
