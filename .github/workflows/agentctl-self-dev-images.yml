# Builds the self-development agent's images from agents/self-dev, as agentctl-agent-images.yml does every agent image.
name: agentctl self-dev images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - agents/self-dev/**
      - images/agentctl-base/**
      - docker-bake.hcl
      - .github/workflows/agentctl-self-dev-images.yml
      - .github/workflows/agentctl-agent-images.yml
      # Neither this image's .dockerignore nor the base's admits this Markdown. agentctl applies the self-dev agent's from its manifest.
      - '!agents/self-dev/**/*.md'
      - '!images/agentctl-base/*.md'
  push:
    branches:
      - main
    paths:
      - agents/self-dev/**
      - images/agentctl-base/**
      - docker-bake.hcl
      - .github/workflows/agentctl-self-dev-images.yml
      - .github/workflows/agentctl-agent-images.yml
      # Neither this image's .dockerignore nor the base's admits this Markdown. agentctl applies the self-dev agent's from its manifest.
      - '!agents/self-dev/**/*.md'
      - '!images/agentctl-base/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentctl-self-dev-images-${{ github.event.pull_request.number || github.ref }}
  # A cancelled publish could leave the two images' tags pointing at different commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    uses: ./.github/workflows/agentctl-agent-images.yml
    with:
      folder: self-dev
      group: self-dev
      images: minimal full
      target-prefix: self-dev-
      image-prefix: agentctl-self-dev-
      # Full is minimal plus the desktop, so it publishes the minimal layers with the same digests, and a host that has
      # minimal only pulls the full layers.
      cache-from-also: self-dev-full=agentctl-self-dev-minimal
