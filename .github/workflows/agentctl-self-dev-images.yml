# Builds the self-development Agent's images from agents/self-dev, on the agentctl base images built from the same
# commit. Pull requests only build them; main, including a manual run on main, also publishes them to GHCR as `latest`
# and `sha-<commit>`.
name: agentctl self-dev images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - agents/self-dev/**
      - images/agentctl-base/**
      - docker-bake.hcl
      - .github/workflows/agentctl-self-dev-images.yml
  push:
    branches:
      - main
    paths:
      - agents/self-dev/**
      - images/agentctl-base/**
      - docker-bake.hcl
      - .github/workflows/agentctl-self-dev-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentctl-self-dev-images-${{ github.event.pull_request.number || github.ref }}
  # A cancelled publish could leave the two images' tags pointing at different commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_REPOSITORY: ghcr.io/digdir/agentctl-base
  REGISTRY: ghcr.io/digdir/digdir-agents

jobs:
  # Each architecture builds on a native runner: under QEMU, the arm64 build took more than 20 minutes for the
  # package layer alone. On main, each pushes its images by digest, and the publish job joins them into the tagged
  # multi-platform images.
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cone mode also checks out the root's files, docker-bake.hcl among them.
          sparse-checkout: |
            agents/self-dev
            images/agentctl-base

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # Both images are built in one bake, on the base image bake builds from this commit: full is minimal plus the
      # desktop, so it publishes the minimal layers with the same digests, and a host that has minimal only pulls the
      # full layers. The base's own cache serves the base layers.
      - name: Build images
        env:
          ARCH: ${{ matrix.arch }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -eu

          metadata="${RUNNER_TEMP}/metadata.json"
          set -- --set "*.platform=linux/${ARCH}" \
            --set "base-headless.cache-from=type=registry,ref=${BASE_REPOSITORY}:buildcache-headless-${ARCH}" \
            --set "self-dev-full.cache-from=type=registry,ref=${REGISTRY}/agentctl-self-dev-minimal:buildcache-${ARCH}"
          for target in minimal full; do
            repository="${REGISTRY}/agentctl-self-dev-${target}"
            set -- "$@" --set "self-dev-${target}.cache-from=type=registry,ref=${repository}:buildcache-${ARCH}"
            if [ "${PUBLISH}" = "true" ]; then
              # Without clearing the bake file's tags, buildx refuses to push by digest; the publish job tags.
              set -- "$@" \
                --set "self-dev-${target}.tags=" \
                --set "self-dev-${target}.output=type=image,name=${repository},push-by-digest=true,name-canonical=true,push=true" \
                --set "self-dev-${target}.cache-to=type=registry,ref=${repository}:buildcache-${ARCH},mode=max,image-manifest=true"
            fi
          done

          docker buildx bake --file docker-bake.hcl --provenance=false --sbom=false --metadata-file "${metadata}" \
            "$@" self-dev

          if [ "${PUBLISH}" = "true" ]; then
            mkdir -p "${RUNNER_TEMP}/digests"
            for target in minimal full; do
              digest="$(jq -r --arg target "self-dev-${target}" '.[$target]."containerimage.digest"' "${metadata}")"
              case "${digest}" in
                sha256:*) printf '%s\n' "${digest}" > "${RUNNER_TEMP}/digests/${target}" ;;
                *) echo "::error::no image digest for self-dev-${target} in ${metadata}"; exit 1 ;;
              esac
            done
          fi

      - name: Upload image digests
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Tag multi-platform images
        run: |
          set -eu

          for target in minimal full; do
            repository="${REGISTRY}/agentctl-self-dev-${target}"
            docker buildx imagetools create \
              --tag "${repository}:sha-${GITHUB_SHA::10}" \
              --tag "${repository}:latest" \
              "${repository}@$(cat "${RUNNER_TEMP}/digests/digests-amd64/${target}")" \
              "${repository}@$(cat "${RUNNER_TEMP}/digests/digests-arm64/${target}")"
            docker buildx imagetools inspect "${repository}:sha-${GITHUB_SHA::10}"
          done
