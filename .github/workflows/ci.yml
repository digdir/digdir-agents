# CI for the whole monorepo. `ci-gate` is the only required status check in
# branch protection, so green CI is enforced by the platform before merge.
#
# Each area is a reusable workflow that runs only when its paths change.
# `ci-gate` fails when a job that ran failed or was cancelled, and passes when
# areas were skipped. New areas are added here without changing branch
# protection.
#
# Draft pull requests run nothing: CI starts when one is marked ready for
# review. A draft labeled `ci` runs CI anyway, from its next push: labeling
# does not start a run, since every label change would then cancel the run in
# progress. Each push to a pull request cancels the run for the push before it,
# and converting it to a draft or closing it cancels its run too, since those
# events start a run in the same group that skips every job.
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      integrations: ${{ steps.areas.outputs.integrations }}
      rust: ${{ steps.areas.outputs.rust }}
    steps:
      - name: Detect changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Each area's paths, as an extended regular expression over the changed file names.
          areas=(
            'integrations=^(integrations/|\.github/CODEOWNERS$|\.github/workflows/(ci|integrations)\.yml$)'
            'rust=^(agentctl/|sandbox/|\.cargo/|(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|rustfmt\.toml|clippy\.toml|deny\.toml|Makefile)$|\.github/workflows/(ci|rust)\.yml$)'
          )
          # A renamed file counts under both its old and its new name.
          names='.filename, (.previous_filename // empty)'
          every_area=false
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq ".[] | ${names}" > changed.txt
          elif [ "$(jq '.commits | length' "${GITHUB_EVENT_PATH}")" = 1 ]; then
            # main is squash-merged, so a push is one commit.
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq ".files[] | ${names}" > changed.txt
          else
            every_area=true
          fi
          for area in "${areas[@]}"; do
            if [ "${every_area}" = true ] || grep -q -E "${area#*=}" changed.txt; then
              echo "${area%%=*}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${area%%=*}=false" >> "${GITHUB_OUTPUT}"
            fi
          done

  integrations:
    needs: changes
    if: needs.changes.outputs.integrations == 'true'
    uses: ./.github/workflows/integrations.yml

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust.yml

  ci-gate:
    name: ci-gate
    # Also in a cancelled run, which fails it: GitHub would accept a skipped required check.
    if: ${{ always() && (github.event_name != 'pull_request' || (github.event.action != 'closed' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci')))) }}
    needs: [changes, integrations, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Check that no needed job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::A needed job ended with ${result}"; exit 1 ;;
            esac
          done
