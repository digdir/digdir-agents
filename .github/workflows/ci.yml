# CI for the whole monorepo. `ci-gate` is the only required status check in
# branch protection, so green CI is enforced by the platform before merge.
#
# Each area is a reusable workflow that runs only when its paths change.
# Markdown changes count only where a build bundles them, since no area builds
# or tests the docs people read.
# `ci-gate` fails when a job that ran failed or was cancelled, and passes when
# areas were skipped. New areas are added here without changing branch
# protection.
#
# CI runs only on pull requests, which test their merge with main; main is
# not tested again after merging. cache-warm.yml saves the Rust caches they
# restore.
#
# Draft pull requests run nothing: CI starts when one is marked ready for
# review. A draft labeled `ci` runs CI anyway, from its next push: labeling
# does not start a run, since every label change would then cancel the run in
# progress. Each push to a pull request cancels the run for the push before it,
# and converting it to a draft or closing it cancels its run too, since those
# events start a run in the same group that skips every job.
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: ${{ github.event.action != 'closed' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      integrations: ${{ steps.areas.outputs.integrations }}
      rust: ${{ steps.areas.outputs.rust }}
      cache-warm: ${{ steps.areas.outputs.cache-warm }}
    steps:
      - name: Detect changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Each area's paths, as an extended regular expression over the changed file names.
          areas=(
            'integrations=^(integrations/|\.github/CODEOWNERS$|\.github/workflows/(ci|integrations)\.yml$)'
            'rust=^(agentctl/|sandbox/|\.cargo/|(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|rustfmt\.toml|clippy\.toml|deny\.toml|Makefile)$|\.github/workflows/(ci|rust)\.yml$)'
            'cache-warm=^\.github/workflows/cache-warm\.yml$'
          )
          # A renamed file counts under both its old and its new name.
          names='.filename, (.previous_filename // empty)'
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq ".[] | ${names}" > files.txt
          # Markdown files that a build bundles, which count like code.
          bundled='^agentctl/skills/'
          grep -E -v '\.md$' files.txt > changed.txt || true
          grep -E "${bundled}" files.txt >> changed.txt || true
          for area in "${areas[@]}"; do
            if grep -q -E "${area#*=}" changed.txt; then
              echo "${area%%=*}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${area%%=*}=false" >> "${GITHUB_OUTPUT}"
            fi
          done

  integrations:
    needs: changes
    if: needs.changes.outputs.integrations == 'true'
    uses: ./.github/workflows/integrations.yml

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust.yml

  # Builds what cache-warm.yml warms, on every host, without saving.
  cache-warm:
    needs: changes
    if: needs.changes.outputs.cache-warm == 'true'
    uses: ./.github/workflows/cache-warm.yml

  ci-gate:
    name: ci-gate
    # Also in a cancelled run, which fails it: GitHub would accept a skipped required check.
    if: ${{ always() && github.event.action != 'closed' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci')) }}
    needs: [changes, integrations, rust, cache-warm]
    runs-on: ubuntu-latest
    steps:
      - name: Check that no needed job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::A needed job ended with ${result}"; exit 1 ;;
            esac
          done
