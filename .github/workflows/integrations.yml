# Type-checks the integrations app. Called from ci.yml when integrations/ changes.
name: integrations

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integrations:
    name: integrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/package-lock.json
      - run: npm ci
      - run: npm run typecheck
