# Builds a bake group's images and, when asked, publishes them, for the workflows that build images to call. Each
# architecture builds on a native runner: under QEMU, an arm64 build of the base took more than 20 minutes for its
# package layer alone. When pushing, each runner pushes its images by digest, and the publish job joins them into
# multi-platform images under the tags the caller names. A release's build stops before that, for the release workflow
# to tag the images when the release pull request lands.
name: Images

on:
  workflow_call:
    inputs:
      files:
        description: The bake files to read, separated by spaces, with paths relative to the repository root
        type: string
        required: true
      group:
        description: The bake group or target to build
        type: string
        required: true
      images:
        description: >-
          A JSON array with an object for each image to publish: its bake `target`, the `repository` it is published
          to, the `cache` reference it reads and, on main, writes, to which `-<arch>` is appended, and the `tags` it is
          published under on main, in which `{sha}` stands for the commit's first 10 characters
        type: string
        required: true
      set:
        description: More bake --set values, one per line, in which `{arch}` stands for the architecture
        type: string
        default: ''
      variables:
        description: Bake variables, as NAME=value, one per line
        type: string
        default: ''
      sparse-checkout:
        description: The directories the build needs, one per line. Cone mode also checks out the root's files
        type: string
        required: true
      mode:
        description: >-
          `build` pushes nothing. `main` pushes the images, tags them and writes their caches. `release` pushes them by
          digest alone and keeps the digests for the release workflow to tag
        type: string
        default: build

jobs:
  build:
    name: Build images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: inputs.mode != 'build'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build images
        env:
          ARCH: ${{ matrix.arch }}
          FILES: ${{ inputs.files }}
          GROUP: ${{ inputs.group }}
          IMAGES: ${{ inputs.images }}
          SET: ${{ inputs.set }}
          VARIABLES: ${{ inputs.variables }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          case "${MODE}" in
            build | main | release) ;;
            *) echo "::error::unknown mode '${MODE}'"; exit 1 ;;
          esac

          while IFS= read -r variable; do
            if [ -n "${variable}" ]; then
              export "${variable?}"
            fi
          done <<< "${VARIABLES}"

          args=()
          for file in ${FILES}; do
            args+=(--file "${file}")
          done
          args+=(--set "*.platform=linux/${ARCH}")
          while IFS= read -r value; do
            if [ -n "${value}" ]; then
              args+=(--set "${value//\{arch\}/${ARCH}}")
            fi
          done <<< "${SET}"
          while IFS=$'\t' read -r target repository cache; do
            args+=(--set "${target}.cache-from=type=registry,ref=${cache}-${ARCH}")
            if [ "${MODE}" != build ]; then
              # Without clearing the bake file's tags, buildx refuses to push by digest. The images are tagged later.
              args+=(
                --set "${target}.tags="
                --set "${target}.output=type=image,name=${repository},push-by-digest=true,name-canonical=true,push=true"
              )
            fi
            # Only main writes the caches, which pull requests and releases read: a cache reference holds only its
            # last export, so a release's would cost main's next build its cache.
            if [ "${MODE}" = main ]; then
              args+=(--set "${target}.cache-to=type=registry,ref=${cache}-${ARCH},mode=max,image-manifest=true")
            fi
          done < <(jq -r '.[] | [.target, .repository, .cache] | @tsv' <<< "${IMAGES}")

          metadata="${RUNNER_TEMP}/metadata.json"
          docker buildx bake --provenance=false --sbom=false --metadata-file "${metadata}" "${args[@]}" "${GROUP}"

          if [ "${MODE}" != build ]; then
            mkdir -p "${RUNNER_TEMP}/digests"
            while IFS= read -r target; do
              digest="$(jq -r --arg target "${target}" '.[$target]."containerimage.digest"' "${metadata}")"
              case "${digest}" in
                sha256:*) printf '%s\n' "${digest}" > "${RUNNER_TEMP}/digests/${target}" ;;
                *) echo "::error::no image digest for ${target} in ${metadata}"; exit 1 ;;
              esac
            done < <(jq -r '.[].target' <<< "${IMAGES}")
          fi

      - name: Upload image digests
        if: inputs.mode != 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digests-${{ inputs.group }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          # A release's are kept until its pull request has merged, which tags the images they name.
          retention-days: ${{ inputs.mode == 'release' && 90 || 1 }}

  publish:
    if: inputs.mode == 'main'
    name: Publish images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ inputs.group }}-*
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Tag multi-platform images
        env:
          GROUP: ${{ inputs.group }}
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail

          digests="${RUNNER_TEMP}/digests/digests-${GROUP}"
          while IFS=$'\t' read -r target repository tags; do
            args=()
            for tag in ${tags}; do
              args+=(--tag "${repository}:${tag//\{sha\}/${GITHUB_SHA::10}}")
            done
            docker buildx imagetools create "${args[@]}" \
              "${repository}@$(cat "${digests}-amd64/${target}")" \
              "${repository}@$(cat "${digests}-arm64/${target}")"
            for tag in ${tags}; do
              docker buildx imagetools inspect "${repository}:${tag//\{sha\}/${GITHUB_SHA::10}}"
            done
          done < <(jq -r '.[] | [.target, .repository, (.tags | join(" "))] | @tsv' <<< "${IMAGES}")
