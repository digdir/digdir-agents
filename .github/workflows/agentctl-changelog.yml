name: agentctl changelog entry

# Requires pull requests that change agentctl or the Sandbox crates to add an entry to agentctl/CHANGELOG.md under
# [Unreleased], using agentctl/changelog.sh. Apply the 'skip-changelog' label to pull requests with no user-visible
# change (refactors, test-only or CI-only work) or a change an Unreleased entry already describes with its issue
# linked; the labeled/unlabeled triggers re-evaluate the check when the label is toggled.
# Markdown-only changes do not trigger the check, except the changelog itself, so that a pull request editing only the
# changelog is still validated.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    paths:
      - 'agentctl/**'
      - 'sandbox/**'
      - '.github/workflows/agentctl-changelog.yml'
      - '!agentctl/**/*.md'
      - '!sandbox/**/*.md'
      - 'agentctl/CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  require-changelog-entry:
    name: Require agentctl changelog entry
    if: ${{ !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate changelog structure
        run: agentctl/changelog.sh validate

      - name: Require an Unreleased entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: agentctl/changelog.sh check-unreleased "$BASE_SHA" "$HEAD_SHA"
