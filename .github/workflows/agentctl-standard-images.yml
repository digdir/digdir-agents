# Builds the standard agents' images from agents/standard, as agentctl-agent-images.yml does every agent image.
name: agentctl standard images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - agents/standard/**
      - images/agentctl-base/**
      - docker-bake.hcl
      - .github/workflows/agentctl-standard-images.yml
      - .github/workflows/agentctl-agent-images.yml
      # Neither the images' .dockerignore nor the base's admits this Markdown. agentctl applies the standard agents'
      # instructions and skills itself.
      - '!agents/standard/**/*.md'
      - '!images/agentctl-base/*.md'
  push:
    branches:
      - main
    paths:
      - agents/standard/**
      - images/agentctl-base/**
      - docker-bake.hcl
      - .github/workflows/agentctl-standard-images.yml
      - .github/workflows/agentctl-agent-images.yml
      # Neither the images' .dockerignore nor the base's admits this Markdown. agentctl applies the standard agents'
      # instructions and skills itself.
      - '!agents/standard/**/*.md'
      - '!images/agentctl-base/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentctl-standard-images-${{ github.event.pull_request.number || github.ref }}
  # A cancelled publish could leave the images' tags pointing at different commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    uses: ./.github/workflows/agentctl-agent-images.yml
    with:
      folder: standard
      group: standard
      # The standard agents' IDs, each the directory under agents/standard, the `standard-<id>` bake target and the
      # `agent-<id>` image.
      images: dotnet-backend-developer
      target-prefix: standard-
      image-prefix: agent-
