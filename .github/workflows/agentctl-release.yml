# Releases agentctl from a manual run on main: the archives for every host, the installers, the license and
# third-party notices, with the version's CHANGELOG.md section as the release notes, and the version's agentctl image,
# ghcr.io/digdir/agentctl:<version>. A run without `publish` is a dry run: it builds, smoke-tests and assembles
# everything, image included, and uploads the release as an artifact. A run with it also publishes what it built, and
# creates the `agentctl/v<version>` tag on the run's commit together with the release. A tag can never be moved or
# deleted and a published release never changed, so creating the tag last means a run that fails spends no version.
name: agentctl release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v0.1.0-preview.13
        required: true
      publish:
        description: Publish the release and create its tag, rather than only dry-run it
        type: boolean
        default: false

permissions:
  contents: read

# Two runs for one version would replace each other's draft release.
concurrency:
  group: agentctl-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: agentctl/${{ inputs.version }}

jobs:
  # Checks what can stop the release before anything is built, so that such a run fails in seconds.
  check:
    name: Check release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build checks it too, but only once its runners start.
      - name: Validate version
        run: |
          if ! printf '%s\n' "${VERSION}" | grep -q -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::${VERSION} is not v<semantic version>"
            exit 1
          fi

      - name: Build release notes from the changelog
        run: |
          agentctl/changelog.sh validate
          agentctl/changelog.sh extract "${VERSION}" > release-notes.md
          cat release-notes.md

      - name: Check that the release can be published
        if: inputs.publish
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "::error::a release is published from main, not ${GITHUB_REF}"
            exit 1
          fi
          status=0
          git ls-remote --exit-code origin "refs/tags/${TAG}" > /dev/null || status=$?
          case "${status}" in
            2) ;;
            0) echo "::error::${TAG} already exists, so ${VERSION} is released"; exit 1 ;;
            *) echo "::error::could not check whether ${TAG} exists"; exit 1 ;;
          esac

      - name: Upload release notes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    needs: check
    uses: ./.github/workflows/agentctl-build.yml
    with:
      version: ${{ inputs.version }}

  # Built before the release, so that an image that does not build stops it. A run that publishes pushes the image by
  # digest, and image-tag tags it once the release is published.
  image:
    name: agentctl image
    needs: check
    # A called workflow's jobs get no more than this grants, even those it skips, such as the image workflow's publish
    # job, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/agentctl-image.yml
    with:
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}

  release:
    name: Publish GitHub release
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true

      - name: Add installers
        run: |
          cp agentctl/install.sh agentctl/install.ps1 dist/

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.2

      # The archives hold only the two binaries the installers and `agentctl self update` accept, so the license and
      # notices are separate assets.
      - name: Add license and third-party notices
        run: |
          cp LICENSE dist/LICENSE
          agentctl/notices/third-party-notices.sh dist/THIRD_PARTY_NOTICES.md

      - name: Upload the dry run's release
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-dry-run
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

      # Immutable releases lock their assets on publication, so upload every asset to a draft first and publish it
      # last. Publishing the draft creates its tag on the commit this run built. A draft left by a failed run has no
      # tag yet and is not immutable, and is replaced.
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every draft for the tag goes, so that the commands below, which find the release by its tag, find only
          # this run's.
          drafts="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id")"
          for id in ${drafts}; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
          gh release create "${TAG}" --draft --prerelease --latest=false --target "${GITHUB_SHA}" \
            --title "agentctl ${VERSION}" --notes-file release-notes.md
          gh release upload "${TAG}" dist/*
          # A tag pushed since the check would take the release in place of the commit this run built.
          status=0
          git ls-remote --exit-code origin "refs/tags/${TAG}" > /dev/null || status=$?
          if [ "${status}" != 2 ]; then
            echo "::error::${TAG} appeared since the check, or could not be checked. The draft stays unpublished"
            exit 1
          fi
          gh release edit "${TAG}" --draft=false

  image-tag:
    name: Tag agentctl image
    if: inputs.publish
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ghcr.io/digdir/agentctl
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentctl-image-digest-*
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Tag multi-platform image
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${REPOSITORY}:${VERSION}" \
            "${REPOSITORY}@$(cat "${RUNNER_TEMP}/digests/agentctl-image-digest-amd64/agentctl")" \
            "${REPOSITORY}@$(cat "${RUNNER_TEMP}/digests/agentctl-image-digest-arm64/agentctl")"
          docker buildx imagetools inspect "${REPOSITORY}:${VERSION}"
