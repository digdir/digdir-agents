# Publishes an agentctl release for an `agentctl/v<version>` tag: the archives for every host, the installers, the
# license and third-party notices, with the version's CHANGELOG.md section as the release notes, and then the
# version's agentctl image, ghcr.io/digdir/agentctl:<version>. A manual run is a dry
# run for a version: it builds, smoke-tests and assembles everything and uploads it as an artifact, but publishes
# nothing, so a failure is caught before the immutable tag is spent.
name: agentctl release

on:
  push:
    tags:
      - 'agentctl/v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to dry-run, such as v0.1.0-preview.10
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('agentctl/{0}', inputs.version) }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip the tag prefix
        id: version
        run: echo "version=${TAG#agentctl/}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/agentctl-build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build release notes from the changelog
        run: |
          agentctl/changelog.sh validate
          agentctl/changelog.sh extract "${TAG#agentctl/}" > release-notes.md
          cat release-notes.md

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Add installers
        run: |
          cp agentctl/install.sh agentctl/install.ps1 dist/

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.2

      # The archives hold only the two binaries the installers and `agentctl self update` accept, so the license and
      # notices are separate assets.
      - name: Add license and third-party notices
        run: |
          cp LICENSE dist/LICENSE
          agentctl/notices/third-party-notices.sh dist/THIRD_PARTY_NOTICES.md

      # Immutable releases lock their assets on publication, so upload every asset to a draft first and publish it
      # last. A draft left by a failed run is not immutable and is replaced.
      - name: Upload the dry run's release
        if: github.event_name != 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-dry-run
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "${TAG}" --yes
          fi
          gh release create "${TAG}" --draft --prerelease --latest=false --verify-tag \
            --title "agentctl ${TAG#agentctl/}" --notes-file release-notes.md
          gh release upload "${TAG}" dist/*
          gh release edit "${TAG}" --draft=false

  # The release's image, built from the tag's commit, once the release itself is published. A dry run publishes none.
  image:
    name: Publish agentctl image
    needs: [version, release]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/agentctl-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
