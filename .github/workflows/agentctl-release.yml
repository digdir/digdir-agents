# Releases agentctl from the pull request that dates a new version in agentctl/CHANGELOG.md. On that pull request it
# builds and smoke-tests the archives for every host, pushes the version's agentctl image by digest, and assembles the
# release: the archives, the installers, the license and third-party notices, and the version's changelog section as
# the release notes. When the pull request lands on main, it publishes exactly those files, creating the
# `agentctl/v<version>` tag on the landed commit as it publishes the release, and tags that image
# ghcr.io/digdir/agentctl:<version>. Nothing is built after the merge, and a tag can never be moved or deleted, so
# creating it last means a run that fails spends no version. Other pull requests and pushes stop in the first job.
name: agentctl release

on:
  pull_request:
  push:
    branches:
      - main
  # Builds the release on main when the merged pull request was not up to date, so that its run built another tree.
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its older build. Releases from main run one at a time.
concurrency:
  group: agentctl-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest released version in the changelog is a release while it has no tag. A pull request is the release
      # pull request only if it dates that version itself, so that other pull requests build nothing while a merged
      # release is still unpublished. Only this repository's pull requests may build one, since the build pushes the
      # image.
      - name: Resolve the version to release
        id: resolve
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          version="$(agentctl/changelog.sh latest)"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git fetch --quiet --depth 1 origin "${BASE_REF}"
            git show FETCH_HEAD:agentctl/CHANGELOG.md > "${RUNNER_TEMP}/base-changelog.md"
            if [ "$(agentctl/changelog.sh latest "${RUNNER_TEMP}/base-changelog.md")" = "${version}" ]; then
              echo "This pull request does not date a new version; nothing to release"
              echo "release=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          status=0
          git ls-remote --exit-code origin "refs/tags/agentctl/${version}" > /dev/null || status=$?
          case "${status}" in
            0)
              echo "agentctl/${version} is released; nothing to release"
              echo "release=false" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
            2) ;;
            *) echo "::error::could not check whether agentctl/${version} exists"; exit 1 ;;
          esac
          if [ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::error::a release is built from a branch of ${GITHUB_REPOSITORY}, not ${HEAD_REPOSITORY}"
            exit 1
          fi
          if ! printf '%s\n' "${version}" | grep -q -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::${version} is not v<semantic version>"
            exit 1
          fi
          agentctl/changelog.sh extract "${version}" > /dev/null
          echo "Releasing ${version}"
          {
            echo "release=true"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build
    needs: version
    if: needs.version.outputs.release == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/agentctl-build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  image:
    name: agentctl image
    needs: version
    if: needs.version.outputs.release == 'true' && github.event_name != 'push'
    # A called workflow's jobs get no more than this grants, even those it skips, such as the image workflow's publish
    # job, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/agentctl-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
      publish: true

  assemble:
    name: Assemble release
    needs: [version, build, image]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build release notes from the changelog
        run: |
          mkdir -p release
          agentctl/changelog.sh extract "${VERSION}" > release/notes.md
          cat release/notes.md

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-*
          path: release/dist
          merge-multiple: true

      - name: Add installers
        run: |
          cp agentctl/install.sh agentctl/install.ps1 release/dist/

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.2

      # The archives hold only the two binaries the installers and `agentctl self update` accept, so the license and
      # notices are separate assets.
      - name: Add license and third-party notices
        run: |
          cp LICENSE release/dist/LICENSE
          agentctl/notices/third-party-notices.sh release/dist/THIRD_PARTY_NOTICES.md

      # A pull request run checks out its merge with main. The release compares this tree with the commit that lands,
      # so that it never publishes files built from other sources.
      - name: Record the source tree
        run: git rev-parse 'HEAD^{tree}' > release/tree

      - name: Upload the release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release
          path: release/
          if-no-files-found: error

  release:
    name: Publish release
    needs: version
    if: needs.version.outputs.release == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # To find the run that built this tree and download its files.
      actions: read
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: agentctl/${{ needs.version.outputs.version }}
      REPOSITORY: ghcr.io/digdir/agentctl
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only a run in this repository counts: a fork's pull request runs its own workflow file.
      - name: Find the run that built this tree
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/agentctl-release.yml/runs?status=success&per_page=100"
          builds=".workflow_runs[] | select(.event != \"push\")"
          builds="${builds} | select(.head_repository.full_name == \"${GITHUB_REPOSITORY}\")"
          run_id=""
          while read -r id head_sha; do
            [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${head_sha}" --jq .tree.sha)" = "${tree}" ] || continue
            files="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts" \
              --jq '[.artifacts[] | select(.name == "release" and (.expired | not))] | length')"
            if [ "${files}" -gt 0 ]; then
              run_id="${id}"
              break
            fi
          done < <(gh api "${runs}" --jq "${builds} | \"\\(.id) \\(.head_sha)\"")
          if [ -z "${run_id}" ]; then
            echo "::error::no successful run built ${VERSION} from tree ${tree}." \
              "A release pull request must be up to date with main when it merges." \
              "To release this commit, run this workflow on main by hand, wait for it to pass, then re-run this job"
            exit 1
          fi
          echo "Publishing the release built in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          echo "run-id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download the release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentctl-image-digest-*
          path: ${{ runner.temp }}/digests
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Verify the source tree
        run: |
          built="$(cat release/tree)"
          if [ "${built}" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "::error::the release was built from tree ${built}, not this commit's"
            exit 1
          fi

      # Immutable releases lock their assets on publication, so upload every asset to a draft first and publish it
      # last. Publishing the draft creates its tag on the commit that landed. A draft left by a failed run has no tag
      # yet and is not immutable, and is replaced.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every draft for the tag goes, so that the commands below, which find the release by its tag, find only
          # this run's.
          drafts="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id")"
          for id in ${drafts}; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
          gh release create "${TAG}" --draft --prerelease --latest=false --target "${GITHUB_SHA}" \
            --title "agentctl ${VERSION}" --notes-file release/notes.md
          gh release upload "${TAG}" release/dist/*
          # A tag pushed since this run started would take the release in place of this commit.
          status=0
          git ls-remote --exit-code origin "refs/tags/${TAG}" > /dev/null || status=$?
          if [ "${status}" != 2 ]; then
            echo "::error::${TAG} appeared during this run, or could not be checked. The draft stays unpublished"
            exit 1
          fi
          gh release edit "${TAG}" --draft=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # The image built with the release, tagged once the release is out.
      - name: Tag the release's image
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${REPOSITORY}:${VERSION}" \
            "${REPOSITORY}@$(cat "${RUNNER_TEMP}/digests/agentctl-image-digest-amd64/agentctl")" \
            "${REPOSITORY}@$(cat "${RUNNER_TEMP}/digests/agentctl-image-digest-arm64/agentctl")"
          docker buildx imagetools inspect "${REPOSITORY}:${VERSION}"
