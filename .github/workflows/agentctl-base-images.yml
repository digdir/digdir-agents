# Builds the agentctl base images from images/agentctl-base. Pull requests only build them; main, including a manual
# run on main, also publishes them to ghcr.io/digdir/agentctl-base as `ubuntu-26.04` and `ubuntu-26.04-desktop`, each
# also tagged with `-sha-<commit>`. Publishing them rebuilds the self-dev images on them (self-dev-images.yml).
name: agentctl base images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - images/agentctl-base/**
      - docker-bake.hcl
      - .github/workflows/agentctl-base-images.yml
      - .github/workflows/images.yml
      # The top-level Markdown is not in the build context, which .dockerignore limits.
      - '!images/agentctl-base/*.md'
  # Not on changes to docker-bake.hcl or images.yml alone: every build of the base has a new digest, which images built
  # on it then follow. self-dev-images.yml publishes on images.yml changes, which tries them on main.
  push:
    branches:
      - main
    paths:
      - images/agentctl-base/**
      - .github/workflows/agentctl-base-images.yml
      # The top-level Markdown is not in the build context, which .dockerignore limits.
      - '!images/agentctl-base/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentctl-base-images-${{ github.event.pull_request.number || github.ref }}
  # A cancelled publish could leave the two tags pointing at different commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Both images are built in one bake: desktop is headless plus its own stage, so it publishes the headless layers with
  # the same digests, and a host that has the headless image only pulls the desktop layers. Desktop also reads the
  # headless cache, for the stage the two share.
  images:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Base images
    uses: ./.github/workflows/images.yml
    with:
      files: docker-bake.hcl
      group: base
      sparse-checkout: images/agentctl-base
      publish: ${{ github.ref == 'refs/heads/main' }}
      set: base-desktop.cache-from=type=registry,ref=ghcr.io/digdir/agentctl-base:buildcache-headless-{arch}
      images: |
        [
          {
            "target": "base-headless",
            "repository": "ghcr.io/digdir/agentctl-base",
            "cache": "ghcr.io/digdir/agentctl-base:buildcache-headless",
            "tags": ["ubuntu-26.04", "ubuntu-26.04-sha-{sha}"]
          },
          {
            "target": "base-desktop",
            "repository": "ghcr.io/digdir/agentctl-base",
            "cache": "ghcr.io/digdir/agentctl-base:buildcache-desktop",
            "tags": ["ubuntu-26.04-desktop", "ubuntu-26.04-desktop-sha-{sha}"]
          }
        ]
