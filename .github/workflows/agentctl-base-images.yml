# Builds the agentctl base images from images/agentctl-base. Pull requests only build them; main, including a manual
# run on main, also publishes them to ghcr.io/digdir/agentctl-base as `ubuntu-26.04` and `ubuntu-26.04-desktop`, each
# also tagged with `-sha-<commit>`.
name: agentctl base images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - images/agentctl-base/**
      - docker-bake.hcl
      - .github/workflows/agentctl-base-images.yml
  # Not on docker-bake.hcl changes alone: every build of the base has a new digest, which derived images then follow.
  push:
    branches:
      - main
    paths:
      - images/agentctl-base/**
      - .github/workflows/agentctl-base-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentctl-base-images-${{ github.event.pull_request.number || github.ref }}
  # A cancelled publish could leave the two tags pointing at different commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPOSITORY: ghcr.io/digdir/agentctl-base
  DISTRIBUTION: ubuntu-26.04

jobs:
  # Each architecture builds on a native runner, as the self-dev images do. On main, each pushes its images by digest,
  # and the publish job joins them into the tagged multi-platform images.
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cone mode also checks out the root's files, docker-bake.hcl among them.
          sparse-checkout: |
            images/agentctl-base

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # Both images are built in one bake: desktop is headless plus its own stage, so it publishes the headless layers
      # with the same digests, and a host that has the headless image only pulls the desktop layers.
      - name: Build images
        env:
          ARCH: ${{ matrix.arch }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -eu

          metadata="${RUNNER_TEMP}/metadata.json"
          set -- --set "*.platform=linux/${ARCH}"
          # Desktop also reads the headless cache, for the stage the two share.
          set -- "$@" --set "base-desktop.cache-from=type=registry,ref=${REPOSITORY}:buildcache-headless-${ARCH}"
          for variant in headless desktop; do
            cache="${REPOSITORY}:buildcache-${variant}-${ARCH}"
            set -- "$@" --set "base-${variant}.cache-from=type=registry,ref=${cache}"
            if [ "${PUBLISH}" = "true" ]; then
              set -- "$@" \
                --set "base-${variant}.output=type=image,name=${REPOSITORY},push-by-digest=true,name-canonical=true,push=true" \
                --set "base-${variant}.cache-to=type=registry,ref=${cache},mode=max,image-manifest=true"
            fi
          done

          docker buildx bake --file docker-bake.hcl --provenance=false --sbom=false --metadata-file "${metadata}" \
            "$@" base

          if [ "${PUBLISH}" = "true" ]; then
            mkdir -p "${RUNNER_TEMP}/digests"
            for variant in headless desktop; do
              digest="$(jq -r --arg target "base-${variant}" '.[$target]."containerimage.digest"' "${metadata}")"
              case "${digest}" in
                sha256:*) printf '%s\n' "${digest}" > "${RUNNER_TEMP}/digests/${variant}" ;;
                *) echo "::error::no image digest for base-${variant} in ${metadata}"; exit 1 ;;
              esac
            done
          fi

      - name: Upload image digests
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Tag multi-platform images
        run: |
          set -eu

          for variant in headless desktop; do
            tag="${DISTRIBUTION}"
            if [ "${variant}" != headless ]; then
              tag="${tag}-${variant}"
            fi
            docker buildx imagetools create \
              --tag "${REPOSITORY}:${tag}-sha-${GITHUB_SHA::10}" \
              --tag "${REPOSITORY}:${tag}" \
              "${REPOSITORY}@$(cat "${RUNNER_TEMP}/digests/digests-amd64/${variant}")" \
              "${REPOSITORY}@$(cat "${RUNNER_TEMP}/digests/digests-arm64/${variant}")"
            docker buildx imagetools inspect "${REPOSITORY}:${tag}-sha-${GITHUB_SHA::10}"
          done
