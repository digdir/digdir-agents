# Builds the agentctl base images from images/agentctl-base, with the sign-in images that share their layers. Pull
# requests only build them; main, including a manual run on main, also publishes them to ghcr.io/digdir/agentctl-base
# as `ubuntu-26.04`, `ubuntu-26.04-desktop` and `ubuntu-26.04-sign-in-<service>`, each also tagged with `-sha-<commit>`.
# Publishing them rebuilds the images built on them, the self-dev images (self-dev-images.yml) and the agent builder's
# (agentctl-agent-builder-image.yml). The release workflow calls this one on a release pull request to push the
# release's images by digest, and tags each as `<tag>-<version>`, such as `ubuntu-26.04-<version>`, when the pull
# request lands, just before it publishes the release.
name: agentctl base images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - images/agentctl-base/**
      - docker-bake.hcl
      - .github/workflows/agentctl-base-images.yml
      - .github/workflows/images.yml
      - .github/scripts/main-version.sh
      # The top-level Markdown is not in the build context, which .dockerignore limits.
      - '!images/agentctl-base/*.md'
  # Not on changes to docker-bake.hcl, images.yml or main-version.sh alone: every build of the base has a new digest,
  # which images built on it then follow. self-dev-images.yml publishes on changes to images.yml, and agentctl-image.yml
  # on changes to the other two, which tries them on main.
  push:
    branches:
      - main
    paths:
      - images/agentctl-base/**
      - .github/workflows/agentctl-base-images.yml
      # The top-level Markdown is not in the build context, which .dockerignore limits.
      - '!images/agentctl-base/*.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version the images belong to and are tagged with, such as v0.1.0-preview.13
        type: string
        required: true
      publish:
        description: >-
          Push the images by digest for the release workflow to tag when the release pull request lands, rather than
          only build them as a release dry run does
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# A release's build has its own group, so that it and the same pull request's own base check cannot cancel each other.
concurrency:
  group: >-
    agentctl-base-images-${{ inputs.version && format('release-{0}', inputs.version)
    || github.event.pull_request.number || github.ref }}
  # A cancelled publish could leave the two tags pointing at different commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The version the images' labels carry: the release's, or `<latest release>.main.g<commit>` for any other build.
  resolve:
    # A release's build always runs, even from a draft.
    if: >-
      ${{ inputs.version != '' || github.event_name != 'pull_request'
      || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_VERSION}" ]; then
            version="${RELEASE_VERSION}"
            if [ "${PUBLISH_RELEASE}" = true ]; then
              mode=release
            else
              mode=build
            fi
          else
            version="$(.github/scripts/main-version.sh "${GITHUB_SHA}")"
            if [ "${GITHUB_REF}" = refs/heads/main ] && [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
              mode=main
            else
              mode=build
            fi
          fi
          echo "Building ${version} from ${GITHUB_SHA}"
          {
            echo "version=${version}"
            echo "mode=${mode}"
          } >> "${GITHUB_OUTPUT}"

  # The images are built in one bake: desktop is headless plus its own stage, so it publishes the headless layers with
  # the same digests, and a host that has the headless image only pulls the desktop layers. The sign-in images copy
  # their tools from the stages headless copies them from, so they share those layers only when one build makes them
  # all. Each also reads the headless cache, for the stages it shares.
  images:
    needs: resolve
    name: Base images
    uses: ./.github/workflows/images.yml
    with:
      files: docker-bake.hcl
      group: base
      sparse-checkout: images/agentctl-base
      mode: ${{ needs.resolve.outputs.mode }}
      variables: AGENT_VERSION=${{ needs.resolve.outputs.version }}
      set: |
        base-desktop.cache-from=type=registry,ref=ghcr.io/digdir/agentctl-base:buildcache-headless-{arch}
        base-sign-in-claude.cache-from=type=registry,ref=ghcr.io/digdir/agentctl-base:buildcache-headless-{arch}
        base-sign-in-codex.cache-from=type=registry,ref=ghcr.io/digdir/agentctl-base:buildcache-headless-{arch}
        base-sign-in-github.cache-from=type=registry,ref=ghcr.io/digdir/agentctl-base:buildcache-headless-{arch}
      images: |
        [
          {
            "target": "base-headless",
            "repository": "ghcr.io/digdir/agentctl-base",
            "cache": "ghcr.io/digdir/agentctl-base:buildcache-headless",
            "tags": ["ubuntu-26.04", "ubuntu-26.04-sha-{sha}"]
          },
          {
            "target": "base-desktop",
            "repository": "ghcr.io/digdir/agentctl-base",
            "cache": "ghcr.io/digdir/agentctl-base:buildcache-desktop",
            "tags": ["ubuntu-26.04-desktop", "ubuntu-26.04-desktop-sha-{sha}"]
          },
          {
            "target": "base-sign-in-claude",
            "repository": "ghcr.io/digdir/agentctl-base",
            "cache": "ghcr.io/digdir/agentctl-base:buildcache-sign-in-claude",
            "tags": ["ubuntu-26.04-sign-in-claude", "ubuntu-26.04-sign-in-claude-sha-{sha}"]
          },
          {
            "target": "base-sign-in-codex",
            "repository": "ghcr.io/digdir/agentctl-base",
            "cache": "ghcr.io/digdir/agentctl-base:buildcache-sign-in-codex",
            "tags": ["ubuntu-26.04-sign-in-codex", "ubuntu-26.04-sign-in-codex-sha-{sha}"]
          },
          {
            "target": "base-sign-in-github",
            "repository": "ghcr.io/digdir/agentctl-base",
            "cache": "ghcr.io/digdir/agentctl-base:buildcache-sign-in-github",
            "tags": ["ubuntu-26.04-sign-in-github", "ubuntu-26.04-sign-in-github-sha-{sha}"]
          }
        ]
